<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparar tracks — GPX Library</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/shared.css">
<script src="/theme.js"></script>
<style>
html, body { height: 100%; overflow: hidden; }
#map { position: fixed; inset: 0; top: var(--nav-h); z-index: 0; }

/* ── Panel izquierdo ── */
:root { --cmp-w: 340px; }
#cmp-panel {
  position: fixed; top: calc(var(--nav-h) + 10px); left: 10px; z-index: 1000;
  width: var(--cmp-w); max-height: calc(100vh - var(--nav-h) - 20px);
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
#cmp-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
.cmp-title-row { display: flex; align-items: center; gap: 8px; }
.cmp-title-row h2 { font-size: 15px; font-weight: 700; flex: 1; display: flex; align-items: center; gap: 8px; }
.cmp-count { min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--soft); color: var(--ink-2); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.cmp-count:empty { display: none; }

/* Buscador para añadir rutas */
#cmp-add { position: relative; }
#cmp-add-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--input-bg); transition: border-color .12s, box-shadow .12s; }
#cmp-add-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
#cmp-add-box svg { color: var(--ink-3); flex-shrink: 0; }
#cmp-add-input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 13px; }
#cmp-add-input::placeholder { color: var(--ink-3); }
#cmp-add-results { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 4px; max-height: 320px; overflow-y: auto; }
#cmp-add-results.open { display: block; }
.add-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.add-item:hover, .add-item.focused { background: var(--soft); }
.add-item-info { flex: 1; min-width: 0; }
.add-item-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.add-item-sub { font-size: 11px; color: var(--muted); }
.add-item-plus { color: var(--accent); font-weight: 700; font-size: 16px; line-height: 1; }
.add-empty { padding: 10px; font-size: 12px; color: var(--muted); text-align: center; }

#cmp-body { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.cmp-empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
.cmp-empty strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

/* Tarjeta de ruta */
.cmp-row {
  position: relative; padding: 10px 10px 10px 14px; border-radius: var(--radius-md); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.cmp-row::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--c); }
.cmp-row:hover { background: var(--hover-bg); }
.cmp-row.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.cmp-row.hidden-track { opacity: .45; }
.cmp-row-top { display: flex; align-items: flex-start; gap: 6px; }
.cmp-row-info { flex: 1; min-width: 0; }
.cmp-row-name { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cmp-row-name a { color: inherit; text-decoration: none; }
.cmp-row-name a:hover { text-decoration: underline; }
.cmp-row-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp-row-actions { display: flex; gap: 2px; flex-shrink: 0; margin: -3px -4px 0 0; }
.cmp-eye { background: none; border: none; cursor: pointer; width: 26px; height: 26px; border-radius: 7px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.cmp-eye:hover { background: var(--soft); color: var(--ink); }
.cmp-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 9px; }
.cmp-metric { min-width: 0; }
.cmp-metric-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--muted); }
.cmp-metric-top strong { font-size: 13px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.cmp-bar { height: 4px; border-radius: 2px; background: var(--soft); margin-top: 3px; overflow: hidden; }
.cmp-bar > span { display: block; height: 100%; border-radius: 2px; background: var(--c); }
.cmp-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.cmp-chip { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.cmp-chip.best { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.cmp-chip.temp { background: color-mix(in srgb, #f59e0b 16%, transparent); color: color-mix(in srgb, #d97706 72%, var(--ink)); }

#cmp-drop-hint { margin: 0 8px 8px; padding: 8px 10px; border: 1.5px dashed var(--line); border-radius: var(--radius-sm); text-align: center; color: var(--muted); font-size: 11.5px; user-select: none; transition: border-color .12s, color .12s; }
#cmp-foot { flex-shrink: 0; padding: 8px; border-top: 1px solid var(--line); display: flex; gap: 4px; align-items: center; }
#cmp-foot .btn { gap: 4px; padding: 0 7px; font-size: 11.5px; }
#cmp-foot .btn svg { flex-shrink: 0; }
#btn-profile { margin-left: auto; }
#btn-profile.active { background: var(--accent); color: #fff; }

/* ── Floating profile panel ── */
#profile-panel {
  position: fixed; bottom: 10px; left: calc(var(--cmp-w) + 20px); right: 10px;
  height: 220px; z-index: 900;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  display: none; flex-direction: column; overflow: hidden;
  animation: panelUp .18s ease-out;
}
@keyframes panelUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
#profile-panel.visible { display: flex; }
#profile-tabs {
  display: flex; gap: 2px; padding: 6px 40px 0 8px; overflow-x: auto;
  border-bottom: 1px solid var(--line); flex-shrink: 0; scrollbar-width: none;
}
.ptab {
  display: flex; align-items: center; gap: 5px; padding: 5px 11px;
  border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; border: 1.5px solid transparent;
  border-bottom: none; color: var(--muted); background: none;
  transition: background .12s;
}
.ptab:hover { background: var(--soft); }
.ptab.active { background: var(--surface); border-color: var(--line); border-bottom-color: var(--surface); color: var(--ink); margin-bottom: -1px; }
.ptab-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
#profile-close {
  position: absolute; top: 5px; right: 8px; z-index: 1;
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px;
}
#profile-close:hover { color: var(--ink); background: var(--soft); }
#profile-body { flex: 1; display: flex; gap: 0; overflow: hidden; }
#profile-stats {
  width: 210px; flex-shrink: 0; padding: 12px 18px;
  display: flex; flex-direction: column; gap: 9px; justify-content: center;
  border-right: 1px solid var(--line); overflow-y: auto;
}
#ps-act  { font-size: 12px; color: var(--muted); }
.ps-row  { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.ps-row strong { color: var(--ink); font-weight: 600; }
#ps-eye {
  margin-top: 2px; width: 32px; height: 32px; padding: 0;
  background: var(--soft); border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer;
  color: var(--ink-2); display: flex; align-items: center; justify-content: center;
}
#ps-eye:hover { background: var(--line); color: var(--ink); }
#profile-svg-wrap { flex: 1; position: relative; padding: 6px 10px; min-width: 0; }
#profile-svg { width: 100%; height: 100%; display: block; }
#cmp-sel-bar {
  display: none; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 4px 10px 4px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  align-items: center; gap: 10px; font-size: 12px; white-space: nowrap; z-index: 10;
}
#cmp-sel-bar span { color: var(--ink); font-weight: 600; }
#cmp-sel-bar button { background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 14px; padding: 0 2px; line-height: 1; }
#cmp-sel-bar button:hover { color: var(--ink); }

/* ── Tooltip ── */
#cmp-tooltip {
  position: fixed; z-index: 2000; pointer-events: none; display: none;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 9px; font-size: 11px;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
#cmp-tooltip .tt-row { color: var(--muted); }
#cmp-tooltip .tt-val { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<nav>
  <span class="logo">GPX Library</span>
  <a href="/">Visor</a>
  <a href="/editor">Catálogo</a>
  <a href="/compare" style="color:#f8fafc">Comparar</a>
  <a href="/trazar">Trazar</a>
  <a href="/config">Config</a>
  <a href="/admin">Admin</a>
</nav>

<div id="map"></div>

<!-- Left panel -->
<div id="cmp-panel">
  <div id="cmp-head">
    <div class="cmp-title-row">
      <h2>Comparar <span id="cmp-count" class="cmp-count"></span></h2>
      <a href="/editor" class="btn btn-ghost btn-sm" title="Volver al catálogo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Catálogo
      </a>
    </div>
    <div id="cmp-add">
      <label id="cmp-add-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <input id="cmp-add-input" type="text" placeholder="Añadir ruta del catálogo…" autocomplete="off">
      </label>
      <div id="cmp-add-results"></div>
    </div>
  </div>

  <div id="cmp-body">
    <div id="cmp-loading" class="cmp-empty">Cargando…</div>
  </div>
  <div id="cmp-drop-hint">o arrastra un fichero .gpx al mapa</div>

  <div id="cmp-foot">
    <button class="btn btn-ghost btn-sm" id="btn-cmp-fit" title="Encuadrar todas las rutas en el mapa">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      Encuadrar
    </button>
    <button class="btn btn-ghost btn-sm" id="btn-cmp-toggle-all" title="Ocultar todas las rutas del mapa">
      <svg id="icon-eye" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="toggle-all-lbl">Ocultar</span>
    </button>
    <button class="btn btn-ghost btn-sm" id="btn-cmp-remove-all" title="Quitar todas las rutas del comparador">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Vaciar
    </button>
    <button class="btn btn-sm" id="btn-profile" title="Mostrar perfiles de altimetría">
      <svg id="icon-profile" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 17 8 10 13 14 18 7 21 10"/><line x1="3" y1="20" x2="21" y2="20"/></svg>
      Perfiles
    </button>
  </div>
</div>

<!-- Bottom elevation panel -->
<div id="profile-panel">
  <button id="profile-close" title="Cerrar">✕</button>
  <div id="profile-tabs"></div>
  <div id="profile-body">
    <div id="profile-stats">
      <div id="ps-act" title="Actividad"></div>
      <div class="ps-row" title="Distancia total del recorrido">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h6M15 6h6M3 18h6M15 18h6"/></svg>
        <strong id="ps-dist">—</strong>
      </div>
      <div class="ps-row" title="Desnivel acumulado positivo / negativo">
        <span>↗ <strong id="ps-gain">—</strong> ↘ <strong id="ps-loss">—</strong></span>
      </div>
      <div class="ps-row" id="ps-time-row" title="Tiempo en movimiento · tiempo total">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="ps-time">—</span>
      </div>
      <button id="ps-eye" title="Alternar visibilidad del track en el mapa">
        <svg id="ps-eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div id="profile-svg-wrap">
      <svg id="profile-svg"></svg>
      <div id="cmp-sel-bar">
        <span>Tramo</span>
        <span id="cmp-sel-dist"></span>
        <span id="cmp-sel-gain"></span>
        <span id="cmp-sel-loss"></span>
        <button id="cmp-sel-clear" title="Cerrar zoom">✕</button>
      </div>
    </div>
  </div>
</div>

<div id="cmp-tooltip">
  <div class="tt-row">📏 <span class="tt-val" id="tt-dist"></span>
    &nbsp; ↑ <span class="tt-val" id="tt-ele"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/import-ui.js"></script>
<script>
'use strict';

const COLORS = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16'];

let ids = (new URLSearchParams(location.search).get('ids') || '')
  .split(',').map(s => parseInt(s.trim())).filter(n => n > 0);
if (!ids.length) {
  try { const s = sessionStorage.getItem('compare-ids'); if (s) ids = s.split(',').map(Number).filter(Boolean); } catch {}
}

function nextColor() {
  const used = new Set(tracks.map(t => t.color));
  return COLORS.find(c => !used.has(c)) || COLORS[tracks.length % COLORS.length];
}
function setCount() { document.getElementById('cmp-count').textContent = tracks.length || ''; }

function saveCompareState() {
  try {
    const dbIds = tracks.filter(t => t.id).map(t => t.id);
    if (dbIds.length) sessionStorage.setItem('compare-ids', dbIds.join(','));
    else sessionStorage.removeItem('compare-ids');
  } catch {}
}

// ── Map ──
const map = L.map('map', { zoomControl: false }).setView([40, -3], 6);
const tileLayers = {
  'Claro':           L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution:'© <a href="https://www.esri.com">Esri</a>, HERE, Garmin, © OpenStreetMap', maxZoom:16 }), L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom:16 })]),
  'Oscuro':          L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution:'© <a href="https://www.esri.com">Esri</a>, HERE, Garmin, © OpenStreetMap', maxZoom:16 }), L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom:16 })]),
  'OpenStreetMap':   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19 }),
  'OpenTopoMap':     L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',   { attribution:'© OpenTopoMap', maxZoom:17 }),
  'IGN Topográfico': L.tileLayer('https://www.ign.es/wmts/mapa-raster?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=MTN&STYLE=default&FORMAT=image/jpeg&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', { attribution:'© <a href="https://www.ign.es">IGN España</a>', maxZoom:20 }),
  'Google Maps':     L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { subdomains:'0123', attribution:'© Google', maxZoom:20 }),
  'Google Satélite': L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { subdomains:'0123', attribution:'© Google', maxZoom:20 }),
  'Google Híbrido':  L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains:'0123', attribution:'© Google', maxZoom:20 }),
};
let baseName = 'Claro';
try { const s = localStorage.getItem('visor-base-layer'); if (tileLayers[s]) baseName = s; } catch {}
tileLayers[baseName].addTo(map);
map.on('baselayerchange', e => { try { localStorage.setItem('visor-base-layer', e.name); } catch {} });
L.control.layers(tileLayers, null, { position:'topright', collapsed:true }).addTo(map);
L.control.zoom({ position:'topright' }).addTo(map);

// ── Helpers ──
function hav(a, b) {
  const R = 6371, dLat = (b[0]-a[0])*Math.PI/180, dLon = (b[1]-a[1])*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(x));
}
function fmtKm(n) { return n == null ? '—' : (n >= 10 ? Math.round(n) : (+n).toFixed(1)) + ' km'; }
function fmtM(n)  { return n == null ? '—' : Math.round(n) + ' m'; }
function esc(s)   { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function ibpVal(d) {
  if (['MTB','Mtb','Gravel','Bikepacking','Ciclismo de carretera'].includes(d.activity)) return d.ibp_bicycle;
  if (['Trail Running','Running'].includes(d.activity)) return d.ibp_running;
  return d.ibp_hiking;
}

// ── State ──
const tracks   = [];
let activeIdx  = null;   // highlighted track
let profileTab = null;   // currently selected profile tab index
let hideTodosTab = false;

// ── Profile ↔ Map cursor ──
let cursorMk  = null;              // circleMarker on map
let gCursorLine  = null;           // SVG cursor line element (current profile)
let gProfileSnap = null;           // { PAD, CW, totalD, pts } for map→profile

function moveCursorMk(pt, color) {
  const ll = [pt[0], pt[1]];
  if (!cursorMk) {
    cursorMk = L.circleMarker(ll, { radius: 7, color, weight: 2.5,
      fillColor: '#fff', fillOpacity: 1, zIndexOffset: 500 }).addTo(map);
  } else {
    cursorMk.setLatLng(ll);
    cursorMk.setStyle({ color });
  }
}
function removeCursorMk() { if (cursorMk) { cursorMk.remove(); cursorMk = null; } }

let selHL = null;
function clearSelHL() { if (selHL) { selHL.remove(); selHL = null; } }
function applySegHL(lls, color) {
  if (!selHL) {
    selHL = L.featureGroup([
      L.polyline(lls, { color: 'white', weight: 13, opacity: 0.85 }),
      L.polyline(lls, { color,          weight: 6,  opacity: 1    }),
    ]).addTo(map);
  } else {
    const [halo, line] = selHL.getLayers();
    halo.setLatLngs(lls); line.setLatLngs(lls);
  }
}

function mapToProfile(latlng, rawPts, color) {
  // find closest raw point
  let bestI = 0, bestD2 = Infinity;
  for (let j = 0; j < rawPts.length; j++) {
    const dlat = latlng.lat - rawPts[j][0], dlon = latlng.lng - rawPts[j][1];
    const d2 = dlat*dlat + dlon*dlon;
    if (d2 < bestD2) { bestD2 = d2; bestI = j; }
  }
  moveCursorMk(rawPts[bestI], color);
  // show cursor on profile SVG if open and snapped
  if (!profileOpen || !gCursorLine || !gProfileSnap) return;
  const snap = gProfileSnap;
  // find matching profile point (rawIdx)
  let bestP = snap.pts[0], bestPD = Infinity;
  snap.pts.forEach(p => { const d = Math.abs(p.rawIdx - bestI); if (d < bestPD) { bestPD = d; bestP = p; } });
  const svgX = snap.PAD.l + bestP.d * snap.CW;
  gCursorLine.setAttribute('x1', svgX); gCursorLine.setAttribute('x2', svgX);
  gCursorLine.style.display = '';
  const tt = document.getElementById('cmp-tooltip');
  document.getElementById('tt-dist').textContent = (bestP.d * snap.totalD).toFixed(1) + ' km';
  document.getElementById('tt-ele').textContent  = Math.round(bestP.e) + ' m';
  const svgEl = document.getElementById('profile-svg');
  if (svgEl) {
    const r = svgEl.getBoundingClientRect();
    tt.style.display = '';
    tt.style.left = (r.left + svgX + 12) + 'px';
    tt.style.top  = (r.top + snap.PAD.t + 10) + 'px';
  }
}

// ── Track list ──
const IBP_LBL = [[50,'Muy fácil'],[100,'Fácil'],[150,'Moderada'],[250,'Dura'],[400,'Muy dura'],[Infinity,'Extrema']];
const ibpLabel = v => v == null ? null : IBP_LBL.find(([max]) => v <= max)[1];

function buildList() {
  const body = document.getElementById('cmp-body');
  body.innerHTML = '';
  setCount();
  if (!tracks.length) {
    body.innerHTML = `<div class="cmp-empty"><strong>Sin rutas que comparar</strong>
      Busca rutas arriba para añadirlas, o en el <a href="/editor">catálogo</a> selecciona varias y pulsa «Comparar».</div>`;
    return;
  }
  const maxDist = Math.max(...tracks.map(t => t.data.distance || 0)) || 1;
  const maxGain = Math.max(...tracks.map(t => t.data.elevation_gain || 0)) || 1;
  tracks.forEach((tr, i) => {
    const d = tr.data;
    const ibp = ibpVal(d);
    const date = d.date ? d.date.substring(0, 10).split('-').reverse().join('/') : '';
    const sub = [d.activity && d.activity !== 'GPX' ? d.activity : null, d.sierra, date].filter(Boolean).map(esc).join(' · ');
    const time = fmtSec(d.moving_time);
    const chips = [
      tr.temp ? '<span class="cmp-chip temp">GPX temporal</span>' : '',
      ibp != null ? `<span class="cmp-chip" title="IBP ${Math.round(ibp)}">IBP ${Math.round(ibp)} · ${ibpLabel(ibp)}</span>` : '',
      time ? `<span class="cmp-chip" title="Tiempo en movimiento">⏱ ${time}</span>` : '',
      d.elevation_loss != null ? `<span class="cmp-chip" title="Desnivel negativo">↘ ${Math.round(d.elevation_loss)} m</span>` : '',
    ].join('');
    const nameHtml = tr.id ? `<a href="/track?id=${tr.id}" target="_blank" title="Abrir detalle">${esc(d.name)}</a>` : esc(d.name);
    const row = document.createElement('div');
    row.className = 'cmp-row' + (tr.visible ? '' : ' hidden-track') + (activeIdx === i ? ' active' : '');
    row.style.setProperty('--c', tr.color);
    row.innerHTML = `
      <div class="cmp-row-top">
        <div class="cmp-row-info">
          <div class="cmp-row-name" title="${esc(d.name)}">${nameHtml}</div>
          ${sub ? `<div class="cmp-row-sub">${sub}</div>` : ''}
        </div>
        <div class="cmp-row-actions">
          <button class="cmp-eye" data-eye="${i}" title="${tr.visible ? 'Ocultar del mapa' : 'Mostrar en el mapa'}">${eyeIcon(tr.visible)}</button>
          ${tr.temp ? `<button class="cmp-eye" data-cat="${i}" title="Guardar en el catálogo" style="color:var(--accent)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          </button>` : ''}
          <button class="cmp-eye" data-rm="${i}" title="Quitar del comparador">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="cmp-metrics">
        <div class="cmp-metric">
          <div class="cmp-metric-top">Distancia <strong>${fmtKm(d.distance)}</strong></div>
          <div class="cmp-bar"><span style="width:${((d.distance || 0) / maxDist * 100).toFixed(1)}%"></span></div>
        </div>
        <div class="cmp-metric">
          <div class="cmp-metric-top">Desnivel + <strong>${fmtM(d.elevation_gain)}</strong></div>
          <div class="cmp-bar"><span style="width:${((d.elevation_gain || 0) / maxGain * 100).toFixed(1)}%"></span></div>
        </div>
      </div>
      ${chips ? `<div class="cmp-tags">${chips}</div>` : ''}`;
    row.addEventListener('click', e => { if (e.target.closest('button, a')) return; highlightTrack(i); });
    row.querySelector('[data-eye]').addEventListener('click', e => { e.stopPropagation(); toggleVisible(i); });
    if (tr.temp) row.querySelector('[data-cat]').addEventListener('click', e => { e.stopPropagation(); catalogTempTrack(i); });
    row.querySelector('[data-rm]').addEventListener('click', e => { e.stopPropagation(); removeTrack(i); });

  });
}

// ── Add from catalog ──
(function () {
  const inp = document.getElementById('cmp-add-input');
  const box = document.getElementById('cmp-add-results');
  let all = null, focus = -1, shown = [];
  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  async function ensureLoaded() {
    if (all) return;
    try { all = await fetch('/api/tracks').then(r => r.json()); } catch { all = []; }
    all.forEach(t => { t._q = norm([t.name, t.sierra, t.activity, t.province].filter(Boolean).join(' ')); });
  }
  async function render() {
    await ensureLoaded();
    const q = norm(inp.value.trim());
    if (!q) { box.classList.remove('open'); return; }
    const words = q.split(/\s+/);
    shown = all.filter(t => !tracks.some(x => x.id === t.id) && words.every(w => t._q.includes(w))).slice(0, 8);
    focus = -1;
    box.innerHTML = shown.length ? shown.map((t, k) => `
      <div class="add-item" data-k="${k}">
        <div class="add-item-info">
          <div class="add-item-name">${esc(t.name)}</div>
          <div class="add-item-sub">${[t.activity, t.sierra, t.distance ? fmtKm(t.distance) : null].filter(Boolean).map(esc).join(' · ')}</div>
        </div>
        <span class="add-item-plus">+</span>
      </div>`).join('') : '<div class="add-empty">Ninguna ruta coincide</div>';
    box.classList.add('open');
  }
  async function pick(k) {
    const t = shown[k]; if (!t) return;
    inp.value = ''; box.classList.remove('open');
    await addTracksById([t.id]);
    inp.focus();
  }
  inp.addEventListener('input', render);
  inp.addEventListener('focus', () => { ensureLoaded(); if (inp.value.trim()) render(); });
  inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 150));
  inp.addEventListener('keydown', e => {
    const items = box.querySelectorAll('.add-item');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      focus = Math.max(0, Math.min(items.length - 1, focus + (e.key === 'ArrowDown' ? 1 : -1)));
      items.forEach((el, k) => el.classList.toggle('focused', k === focus));
      items[focus]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); pick(focus >= 0 ? focus : 0); }
    else if (e.key === 'Escape') { inp.value = ''; box.classList.remove('open'); inp.blur(); }
  });
  box.addEventListener('mousedown', e => {
    const el = e.target.closest('.add-item'); if (!el) return;
    e.preventDefault(); pick(+el.dataset.k);
  });
})();

function eyeIcon(vis) {
  return vis
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
}

function fmtSec(s) {
  if (!s) return null;
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

// ── Profile stats panel ──
function updateProfileStats(i) {
  const statsRows = ['ps-dist', 'ps-gain', 'ps-time-row', 'ps-eye'].map(id => document.getElementById(id));
  if (i === -1) {
    document.getElementById('ps-act').innerHTML = tracks.map(tr =>
      `<span style="display:flex;align-items:center;gap:5px;margin-bottom:3px">` +
      `<span style="width:8px;height:8px;border-radius:50%;background:${tr.color};flex-shrink:0"></span>` +
      `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(tr.data.name.length > 20 ? tr.data.name.slice(0,18)+'…' : tr.data.name)}</span>` +
      `<span style="opacity:.55;font-size:11px;flex-shrink:0">${fmtKm(tr.data.distance)}</span></span>`
    ).join('');
    statsRows.forEach(el => { if (el) el.style.display = 'none'; });
    return;
  }
  statsRows.forEach(el => { if (el) el.style.display = ''; });
  const d    = tracks[i].data;
  const movT = fmtSec(d.moving_time);
  const totT = fmtSec((d.moving_time || 0) + (d.stopped_time || 0));
  document.getElementById('ps-act').textContent  = d.activity || '';
  document.getElementById('ps-dist').textContent = fmtKm(d.distance);
  document.getElementById('ps-gain').textContent = d.elevation_gain != null ? '+'+Math.round(d.elevation_gain)+'m' : '—';
  document.getElementById('ps-loss').textContent = d.elevation_loss != null ? '-'+Math.round(d.elevation_loss)+'m' : '—';
  const timeEl = document.getElementById('ps-time');
  if (movT) {
    timeEl.textContent = totT && totT !== movT ? `${movT} · ${totT}` : movT;
    document.getElementById('ps-time-row').title = totT && totT !== movT
      ? 'Tiempo en movimiento · tiempo total' : 'Tiempo en movimiento';
  } else {
    timeEl.textContent = '—';
  }
  updateEyeBtn(i);
}

// ── Highlight ──
function highlightTrack(i) {
  activeIdx = activeIdx === i ? null : i;
  applyHighlight();
  buildList();
  if (activeIdx !== null && tracks[activeIdx].polyline)
    map.fitBounds(tracks[activeIdx].polyline.getBounds(), mapPad());
}

function applyHighlight() {
  tracks.forEach((tr, j) => {
    if (!tr.polyline) return;
    const isHL = activeIdx === null || j === activeIdx;
    tr.polyline.setStyle({ weight: j === activeIdx ? 5 : 3, opacity: isHL ? 1 : 0.6 });
    if (j === activeIdx) tr.polyline.bringToFront();
  });
}

// ── Visibility ──
function toggleVisible(i) {
  tracks[i].visible = !tracks[i].visible;
  const tr = tracks[i];
  if (tr.polyline) { tr.visible ? map.addLayer(tr.polyline) : map.removeLayer(tr.polyline); }
  buildList();
  if (profileTab === i) updateEyeBtn(i);
}

// ── Remove track ──
function removeTrack(i) {
  const tr = tracks[i];
  if (tr.polyline) map.removeLayer(tr.polyline);
  tracks.splice(i, 1);
  if (activeIdx === i) activeIdx = null;
  else if (activeIdx > i) activeIdx--;
  if (profileTab === -1) {
    if (tracks.length >= 2) { buildProfileTabs(); drawAllProfiles(); updateProfileStats(-1); }
    else if (tracks.length === 1) selectProfileTab(0);
    else toggleProfile(false);
  } else if (profileTab === i) {
    profileTab = tracks.length ? 0 : null;
    if (tracks.length) selectProfileTab(profileTab);
    else toggleProfile(false);
  } else if (profileTab > i) profileTab--;
  setCount();
  buildList();
  if (profileOpen && tracks.length) buildProfileTabs();
  removeCursorMk();
  gCursorLine = null; gProfileSnap = null;
  saveCompareState();
}

function removeAllTracks() {
  tracks.forEach(tr => { if (tr.polyline) map.removeLayer(tr.polyline); });
  tracks.length = 0;
  activeIdx = null; profileTab = null;
  toggleProfile(false);
  setCount();
  buildList();
  removeCursorMk();
  gCursorLine = null; gProfileSnap = null;
  saveCompareState();
}

}

function buildProfileTabs() {
  const strip = document.getElementById('profile-tabs');
  strip.innerHTML = '';
  tracks.forEach((tr, i) => {
    const btn = document.createElement('button');
    btn.className = 'ptab' + (i === profileTab ? ' active' : '');
    btn.innerHTML = `<span class="ptab-dot" style="background:${tr.color}"></span>${esc(tr.data.name.length > 22 ? tr.data.name.slice(0,20)+'…' : tr.data.name)}`;
    btn.addEventListener('click', () => selectProfileTab(i));
    strip.appendChild(btn);
  });
  if (tracks.filter(tr => tr.profile && tr.profile.length >= 2).length >= 2) {
    if (!hideTodosTab) {
      const btn = document.createElement('button');
      btn.className = 'ptab' + (profileTab === -1 ? ' active' : '');
      btn.style.cssText = 'font-style:normal;letter-spacing:0.02em;gap:8px';
      btn.title = 'Ver todos los perfiles juntos';
      const label = document.createElement('span');
      label.textContent = '∥ Todos';
      label.addEventListener('click', e => { e.stopPropagation(); selectProfileTab(-1); });
      const closeX = document.createElement('span');
      closeX.textContent = '✕';
      closeX.title = 'Ocultar pestaña Todos';
      closeX.style.cssText = 'font-size:10px;opacity:.55;line-height:1;padding:0 1px;cursor:pointer';
      closeX.addEventListener('click', e => {

        else buildProfileTabs();
      });

function selectProfileTab(i) {
  profileTab = i;
  if (i === -1) {
    activeIdx = null;
    applyHighlight();

    drawAllProfiles();

  }

  applyHighlight();

// ── Draw all profiles overlaid ──
function drawAllProfiles() {
  const svg = document.getElementById('profile-svg');
  svg.innerHTML = '';
  gCursorLine = null; gProfileSnap = null;
  document.getElementById('cmp-sel-bar').style.display = 'none';

  const valid = tracks.filter(tr => tr.profile && tr.profile.length >= 2);
  if (!valid.length) {
    svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="var(--muted)" font-size="12">Sin datos de altimetría</text>';
    return;
  }

  const refTrack = valid.reduce((a, b) => (a.totalDist || 0) >= (b.totalDist || 0) ? a : b);
  const totalD = refTrack.totalDist || 1;

  const allEles = valid.flatMap(tr => tr.profile.map(p => p.e).filter(e => e != null));
  const minE = Math.min(...allEles), maxE = Math.max(...allEles);
  const eRange = maxE - minE || 1;

  const rect = document.getElementById('profile-svg-wrap').getBoundingClientRect();
  const W = rect.width || 600, H = rect.height || 130;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const PAD = { t: 10, r: 8, b: 24, l: 42 };
  const CW = W - PAD.l - PAD.r, CH = H - PAD.t - PAD.b;
  const xp = d => PAD.l + d * CW;
  const yp = e => PAD.t + CH - ((e - minE) / eRange) * CH;

  // Grid lines
  for (let k = 0; k <= 4; k++) {
    const e = minE + (eRange * k / 4);
    const y = yp(e);
    const gl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    gl.setAttribute('x1', PAD.l); gl.setAttribute('x2', PAD.l + CW);
    gl.setAttribute('y1', y); gl.setAttribute('y2', y);
    gl.setAttribute('stroke', 'var(--line)'); gl.setAttribute('stroke-width', '0.5');
    svg.appendChild(gl);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', PAD.l - 4); lbl.setAttribute('y', y + 3.5);
    lbl.setAttribute('text-anchor', 'end'); lbl.setAttribute('font-size', '9');
    lbl.setAttribute('fill', 'var(--muted)'); lbl.textContent = Math.round(e) + ' m';
    svg.appendChild(lbl);
  }

  // Distance labels
  const distSteps = [1,2,5,10,20,50,100];
  const step = distSteps.find(s => totalD / s <= 6) || Math.ceil(totalD / 6);
  for (let d = 0; d <= totalD; d += step) {
    const x = xp(d / totalD);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', x); lbl.setAttribute('y', H - PAD.b + 13);
    lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('font-size', '9');
    lbl.setAttribute('fill', 'var(--muted)'); lbl.textContent = d + ' km';
    svg.appendChild(lbl);
  }

  // Draw each track (fills first, then lines on top)
  valid.forEach(tr => {
    const pts = tr.profile.filter(p => p.e != null);
    if (pts.length < 2) return;
    const trD = tr.totalDist || totalD;
    const sx = d => PAD.l + (d * trD / totalD) * CW;
    const polyPts = [
      [sx(pts[0].d), H - PAD.b],
      ...pts.map(p => [sx(p.d), yp(p.e)]),
      [sx(pts[pts.length-1].d), H - PAD.b],
    ].map(([x,y]) => `${x},${y}`).join(' ');
    const fill = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    fill.setAttribute('points', polyPts);
    fill.setAttribute('fill', tr.color); fill.setAttribute('opacity', '0.12');
    svg.appendChild(fill);
  });
  valid.forEach(tr => {
    const pts = tr.profile.filter(p => p.e != null);
    if (pts.length < 2) return;
    const trD = tr.totalDist || totalD;
    const sx = d => PAD.l + (d * trD / totalD) * CW;
    const linePts = pts.map(p => `${sx(p.d)},${yp(p.e)}`).join(' ');
    const lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    lineEl.setAttribute('points', linePts); lineEl.setAttribute('fill', 'none');
    lineEl.setAttribute('stroke', tr.color); lineEl.setAttribute('stroke-width', '1.8');
    lineEl.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(lineEl);
  });
}

// ── Draw elevation SVG for one track ──
function drawProfile(i) {
  const svg  = document.getElementById('profile-svg');
  const tr   = tracks[i];
  svg.innerHTML = '';
  if (!tr.profile || tr.profile.length < 2) {
    svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="var(--muted)" font-size="12">Sin datos de altimetría</text>';
    return;
  }

  const pts = tr.profile.map((p, j) => ({ ...p, rawIdx: j })).filter(p => p.e != null);
  if (pts.length < 2) return;
  const rawPts = tr.rawPts || [];

  const rect = document.getElementById('profile-svg-wrap').getBoundingClientRect();
  const W = rect.width || 600, H = rect.height || 130;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const PAD = { t: 10, r: 8, b: 24, l: 42 };
  const CW = W - PAD.l - PAD.r, CH = H - PAD.t - PAD.b;
  const minE = Math.min(...pts.map(p => p.e)), maxE = Math.max(...pts.map(p => p.e));
  const eRange = maxE - minE || 1;
  const totalD = tr.totalDist || 1;

  const xp = d => PAD.l + d * CW;
  const yp = e => PAD.t + CH - ((e - minE) / eRange) * CH;

  // Grid lines
  const nLines = 4;
  for (let k = 0; k <= nLines; k++) {
    const e = minE + (eRange * k / nLines);
    const y = yp(e);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', PAD.l); line.setAttribute('x2', PAD.l + CW);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', 'var(--line)'); line.setAttribute('stroke-width', '0.5');
    svg.appendChild(line);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', PAD.l - 4); lbl.setAttribute('y', y + 3.5);
    lbl.setAttribute('text-anchor', 'end'); lbl.setAttribute('font-size', '9');
    lbl.setAttribute('fill', 'var(--muted)'); lbl.textContent = Math.round(e) + ' m';
    svg.appendChild(lbl);
  }

  // Distance labels
  const distSteps = [1,2,5,10,20,50,100];
  const targetTicks = 6;
  const step = distSteps.find(s => totalD / s <= targetTicks) || Math.ceil(totalD / targetTicks);
  for (let d = 0; d <= totalD; d += step) {
    const x = xp(d / totalD);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', x); lbl.setAttribute('y', H - PAD.b + 13);
    lbl.setAttribute('text-anchor', 'middle'); lbl.setAttribute('font-size', '9');
    lbl.setAttribute('fill', 'var(--muted)'); lbl.textContent = d + ' km';
    svg.appendChild(lbl);
  }

  // Fill area
  const polyPts = [
    [xp(pts[0].d), H - PAD.b],
    ...pts.map(p => [xp(p.d), yp(p.e)]),
    [xp(pts[pts.length-1].d), H - PAD.b],
  ].map(([x,y]) => `${x},${y}`).join(' ');

  const fill = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  fill.setAttribute('points', polyPts);
  fill.setAttribute('fill', tr.color); fill.setAttribute('opacity', '0.15');
  svg.appendChild(fill);

  // Line
  const linePts = pts.map(p => `${xp(p.d)},${yp(p.e)}`).join(' ');
  const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  line2.setAttribute('points', linePts); line2.setAttribute('fill', 'none');
  line2.setAttribute('stroke', tr.color); line2.setAttribute('stroke-width', '2');
  line2.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(line2);

  // Hover cursor line
  const cursor = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  cursor.setAttribute('stroke', 'var(--ink-2)'); cursor.setAttribute('stroke-width', '1');
  cursor.setAttribute('stroke-dasharray', '3 2'); cursor.style.display = 'none';
  cursor.setAttribute('y1', PAD.t); cursor.setAttribute('y2', PAD.t + CH);
  svg.appendChild(cursor);

  // Drag-to-select rect
  const selRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  selRect.setAttribute('y', PAD.t); selRect.setAttribute('height', CH);
  selRect.setAttribute('fill', 'var(--accent)'); selRect.setAttribute('opacity', '0');
  selRect.setAttribute('pointer-events', 'none');
  svg.appendChild(selRect);

  // store for map→profile reverse lookup
  gCursorLine  = cursor;
  gProfileSnap = { PAD, CW, totalD, pts, rawPts, color: tr.color };

  function fracToIdx(rel) {
    let best = pts[0], bestD = Infinity;
    pts.forEach(p => { const d = Math.abs(p.d - rel); if (d < bestD) { bestD = d; best = p; } });
    return best;
  }
  function showTooltip(best, ex, ey) {
    cursor.setAttribute('x1', PAD.l + best.d * CW);
    cursor.setAttribute('x2', PAD.l + best.d * CW);
    cursor.style.display = '';
    const tt = document.getElementById('cmp-tooltip');
    document.getElementById('tt-dist').textContent = (best.d * totalD).toFixed(1) + ' km';
    document.getElementById('tt-ele').textContent  = Math.round(best.e) + ' m';
    tt.style.display = '';
    tt.style.left = (ex + 12) + 'px';
    tt.style.top  = (ey - 20) + 'px';
  }
  function hideTooltip() {
    cursor.style.display = 'none';
    document.getElementById('cmp-tooltip').style.display = 'none';
  }

  function showSegStats(segRaw) {
    let segDist = 0, segGain = 0, segLoss = 0;
    for (let k = 1; k < segRaw.length; k++) {
      segDist += hav(segRaw[k-1], segRaw[k]);
      const de = (segRaw[k][2] || 0) - (segRaw[k-1][2] || 0);
      if (de > 0) segGain += de; else segLoss -= de;
    }
    document.getElementById('cmp-sel-dist').textContent = segDist.toFixed(1) + ' km';
    document.getElementById('cmp-sel-gain').textContent = '↑ ' + Math.round(segGain) + ' m';
    document.getElementById('cmp-sel-loss').textContent = '↓ ' + Math.round(segLoss) + ' m';
    document.getElementById('cmp-sel-bar').style.display = 'flex';
  }

  let dragAnchor = null, rafPending = false;

  svg.addEventListener('mousedown', e => {
    const r = svg.getBoundingClientRect();
    dragAnchor = e.clientX - r.left;
    selRect.setAttribute('x', dragAnchor); selRect.setAttribute('width', 0);
    selRect.setAttribute('opacity', '0.15');
    e.preventDefault();
  });

  svg.onmousemove = e => {
    const r  = svg.getBoundingClientRect();
    const mx = e.clientX - r.left;

    if (dragAnchor !== null) {
      const x1 = Math.min(dragAnchor, mx), x2 = Math.max(dragAnchor, mx);
      selRect.setAttribute('x', x1); selRect.setAttribute('width', x2 - x1);
      if (!rafPending && x2 - x1 > 4) {
        rafPending = true;
        requestAnimationFrame(() => {
          rafPending = false;
          const rel1 = (Math.max(PAD.l, x1) - PAD.l) / CW;
          const rel2 = (Math.min(PAD.l + CW, x2) - PAD.l) / CW;
          const p1 = fracToIdx(rel1), p2 = fracToIdx(rel2);
          if (p1.rawIdx < p2.rawIdx) {
            const segRaw = rawPts.slice(p1.rawIdx, p2.rawIdx + 1);
            applySegHL(segRaw.map(p => [p[0], p[1]]), tr.color);
            showSegStats(segRaw);
          }
        });
      }
      return;
    }

    if (mx < PAD.l || mx > PAD.l + CW) { hideTooltip(); removeCursorMk(); return; }
    const best = fracToIdx((mx - PAD.l) / CW);
    showTooltip(best, e.clientX, e.clientY);
    const rp = rawPts[best.rawIdx];
    if (rp) moveCursorMk(rp, tr.color);
  };

  svg.onmouseleave = () => { if (dragAnchor === null) { hideTooltip(); removeCursorMk(); } };

  svg._commitSel = e => {
    if (dragAnchor === null) return;
    const r  = svg.getBoundingClientRect();
    const mx = e.clientX - r.left;
    const x1 = Math.min(dragAnchor, mx), x2 = Math.max(dragAnchor, mx);
    dragAnchor = null;
    selRect.setAttribute('opacity', '0');
    if (x2 - x1 < 6) { clearSelHL(); document.getElementById('cmp-sel-bar').style.display = 'none'; return; }
    const rel1 = (Math.max(PAD.l, x1) - PAD.l) / CW;
    const rel2 = (Math.min(PAD.l + CW, x2) - PAD.l) / CW;
    const p1 = fracToIdx(rel1), p2 = fracToIdx(rel2);
    if (p1.rawIdx < p2.rawIdx) {
      const segRaw = rawPts.slice(p1.rawIdx, p2.rawIdx + 1);
      const lls = segRaw.map(p => [p[0], p[1]]);
      applySegHL(lls, tr.color);
      map.fitBounds(L.latLngBounds(lls), { padding: [40, 40] });
      showSegStats(segRaw);
    }
  };
  if (!window._cmpMouseUp) {
    window._cmpMouseUp = e => { document.getElementById('profile-svg')?._commitSel?.(e); };
    window.addEventListener('mouseup', window._cmpMouseUp);
  }

  function resetSel() {
    clearSelHL();
    document.getElementById('cmp-sel-bar').style.display = 'none';
    fitAll();
  }
  svg.addEventListener('dblclick', resetSel);

  // wire up ✕ button (only once, replace handler each redraw)
  const selClearBtn = document.getElementById('cmp-sel-clear');
  selClearBtn.onclick = resetSel;
}

// ── Load ──
async function loadTracks() {
  if (!ids.length) { buildList(); return; }
  await addTracksById(ids);
}

async function addTracksById(idList) {
  const fresh = idList.filter(id => !tracks.some(t => t.id === id));
  if (!fresh.length) return;
  const results = await Promise.allSettled(fresh.map(id => fetch('/api/tracks/' + id).then(r => r.ok ? r.json() : null)));

  results.forEach(r => {
    if (r.status !== 'fulfilled' || !r.value) return;
    const data  = r.value;
    const color = nextColor();
    const pts   = (data.points || []).filter(p => p[0] && p[1]);

    let polyline = null;
    if (pts.length > 1) {
      polyline = L.polyline(pts.map(p => [p[0], p[1]]), { color, weight: 3, opacity: 0.9 }).addTo(map);
      polyline.on('click', () => { const idx = tracks.findIndex(t => t.polyline === polyline); if (idx < 0) return; if (!profileOpen) highlightTrack(idx); else selectProfileTab(idx); });
      polyline.on('mousemove', e => { mapToProfile(e.latlng, pts, color); });
      polyline.on('mouseout',  () => { if (gCursorLine) gCursorLine.style.display = 'none'; document.getElementById('cmp-tooltip').style.display = 'none'; removeCursorMk(); });
    }

    let profile = null, totalDist = 0;
    if (pts.length > 1 && pts.some(p => p[2] != null)) {
      let cum = 0;
      const segs = pts.map((p, i) => {
        if (i > 0) cum += hav(pts[i-1], p);
        return { e: p[2], cum };
      });
      totalDist = cum || 1;
      profile = segs.map(s => ({ d: s.cum / totalDist, e: s.e }));
    }

    tracks.push({ id: data.id, data, color, polyline, visible: true, profile, totalDist, rawPts: pts });
  });

  setCount();
  buildList();
  fitAll();
  saveCompareState();
}

// ── Add a temporary (non-DB) track from dropped GPX ──
function addTempTrack({ name, pts, gpxText, filename }) {
  const color = nextColor();
  const validPts = pts.filter(p => p[0] && p[1]);
  if (validPts.length < 2) return;

  let polyline = L.polyline(validPts.map(p => [p[0], p[1]]), { color, weight: 3, opacity: 0.9 }).addTo(map);
  polyline.on('click', () => { const idx = tracks.findIndex(t => t.polyline === polyline); if (idx < 0) return; if (!profileOpen) highlightTrack(idx); else selectProfileTab(idx); });
  polyline.on('mousemove', e => { mapToProfile(e.latlng, validPts, color); });
  polyline.on('mouseout',  () => { if (gCursorLine) gCursorLine.style.display = 'none'; document.getElementById('cmp-tooltip').style.display = 'none'; removeCursorMk(); });

  // compute stats from points
  let distKm = 0, gain = 0, loss = 0;
  for (let i = 1; i < validPts.length; i++) {
    distKm += hav(validPts[i-1], validPts[i]);
    const dEle = validPts[i][2] - validPts[i-1][2];
    if (dEle > 0) gain += dEle; else loss += Math.abs(dEle);
  }

  let profile = null, totalDist = 0;
  if (validPts.some(p => p[2] != null)) {
    let cum = 0;
    const segs = validPts.map((p, i) => {
      if (i > 0) cum += hav(validPts[i-1], p);
      return { e: p[2], cum };
    });
    totalDist = cum || 1;
    profile = segs.map(s => ({ d: s.cum / totalDist, e: s.e }));
  }

  const fakeData = {
    id: null, name, activity: 'GPX',
    distance: Math.round(distKm * 10) / 10,
    elevation_gain: Math.round(gain),
    elevation_loss: Math.round(loss),
    moving_time: null, stopped_time: null, points: validPts
  };
  tracks.push({ id: null, data: fakeData, color, polyline, visible: true, profile, totalDist,
    rawPts: validPts, temp: true, gpxText, filename });

  setCount();
  buildList();
  map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
}

// ── Catalog a temp track (show import modal) ──
function catalogTempTrack(i) {
  const tr = tracks[i];
  if (!tr || !tr.temp || !tr.gpxText) return;

  const modalOvl = document.getElementById('dnd-modal-overlay');
  const logEl    = document.getElementById('dnd-log');
  const nameEl   = document.getElementById('dnd-filename');
  const foot     = document.getElementById('dnd-foot');
  const choice   = document.getElementById('dnd-choice');

  nameEl.textContent = tr.filename || tr.data.name + '.gpx';
  logEl.innerHTML = '';
  logEl.style.display = 'block';
  choice.style.display = 'none';
  foot.style.display = 'none';
  modalOvl.style.display = 'flex';

  function addLog(text) { importLog(logEl, text); }
  function showClose(fn) {
    foot.style.display = 'flex';
    foot.innerHTML = '<button class="btn" id="dnd-done-btn">Cerrar</button>';
    document.getElementById('dnd-done-btn').onclick = fn || (() => { modalOvl.style.display = 'none'; });
  }

  addLog('⬆ Subiendo ' + nameEl.textContent + '…');
  const blob = new Blob([tr.gpxText], { type: 'application/gpx+xml' });
  fetch('/api/import/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/gpx+xml', 'X-Filename': tr.filename || 'track.gpx' },
    body: blob
  }).then(r => r.json()).then(uploaded => {
    if (!uploaded.ok) { addLog('✗ Error en servidor'); showClose(); return; }
    addLog('✓ Fichero guardado, iniciando importación…');
    let isErr = false;
    fetch('/api/db/import-temp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: [uploaded.filename], keep: true })
    }).then(resp => {
      const reader = resp.body.getReader(), dec = new TextDecoder();
      let buf = '';
      function pump() {
        reader.read().then(({ done, value }) => {
          if (done) { finish(isErr); return; }
          buf += dec.decode(value, { stream: true });
          const parts = buf.split('\n\n'); buf = parts.pop();
          for (const part of parts) {
            const dl = part.split('\n').find(l => l.startsWith('data:'));
            if (!dl) continue;
            try {
              const evt = JSON.parse(dl.slice(5));
              if (evt.type === 'log' || evt.type === 'progress') addLog(evt.text);
              if (evt.type === 'warn')  addLog('⚠ ' + evt.text);
              if (evt.type === 'error') { addLog('✗ ' + evt.text); isErr = true; }
              if (evt.type === 'done')  { isErr = evt.code !== 0; finish(isErr); return; }
            } catch {}
          }
          pump();
        }).catch(e => { addLog('✗ ' + e.message); finish(true); });
      }
      pump();
    });
    function finish(err) {
      importLogSummary(logEl, err);
      if (!err) { tr.temp = false; delete tr.gpxText; delete tr.filename; buildList(); }
      foot.style.display = 'flex';
      if (!err) {
        foot.innerHTML = '<button class="btn btn-primary" id="dnd-open-cat">Ver en catálogo</button>' +
                         '<button class="btn" id="dnd-done-btn">Cerrar</button>';
        document.getElementById('dnd-open-cat').onclick = () => { window.open('/editor?q=' + encodeURIComponent(tr.data.name), '_blank'); modalOvl.style.display = 'none'; };
      } else {
        foot.innerHTML = '<button class="btn" id="dnd-done-btn">Cerrar</button>';
      }
      document.getElementById('dnd-done-btn').onclick = () => { modalOvl.style.display = 'none'; };
    }
  }).catch(e => { addLog('✗ ' + e.message); showClose(); });
}

loadTracks();
</script>

<script>
(function() {
  let pendingFile = null;
  const overlay   = document.getElementById('dnd-overlay');
  const modalOvl  = document.getElementById('dnd-modal-overlay');
  const logEl     = document.getElementById('dnd-log');
  const nameEl    = document.getElementById('dnd-filename');
  const foot      = document.getElementById('dnd-foot');
  const panel     = document.getElementById('cmp-panel');
  const dropHint  = document.getElementById('cmp-drop-hint');
  let dragCount   = 0;

  function showOverlay(v) {
    overlay.style.display = v ? 'flex' : 'none';
    overlay.style.pointerEvents = v ? 'all' : 'none';
    dropHint.style.borderColor = v ? 'var(--accent)' : 'var(--line)';
    dropHint.style.color       = v ? 'var(--accent)' : 'var(--muted)';
    panel.style.boxShadow      = v
      ? '0 4px 24px rgba(0,0,0,.15), 0 0 0 2px var(--accent)'
      : '0 4px 24px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.08)';
  }
  function addLog(text) { importLog(logEl, text); }

  document.addEventListener('dragenter', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    dragCount++;
    showOverlay(true);
  });
  document.addEventListener('dragleave', () => {
    dragCount--;
    if (dragCount <= 0) { dragCount = 0; showOverlay(false); }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCount = 0; showOverlay(false);
    const f = e.dataTransfer.files[0];
    if (!f || !f.name.toLowerCase().endsWith('.gpx')) return;
    pendingFile = f;
    nameEl.textContent = f.name;
    logEl.innerHTML = '';
    logEl.style.display = 'none';
    document.getElementById('dnd-choice').style.display = 'flex';
    foot.style.display = 'none';
    document.getElementById('dnd-btn-view').onclick    = doViewOnMap;
    document.getElementById('dnd-btn-catalog').onclick = doImport;
    modalOvl.style.display = 'flex';
  });

  document.getElementById('dnd-close').onclick = closeModal;

  function closeModal() { modalOvl.style.display = 'none'; pendingFile = null; }

  function hideChoice() {
    document.getElementById('dnd-choice').style.display = 'none';
    logEl.style.display = 'block';
  }

  // ── Opción 1: ver en el mapa (track temporal) ──
  async function doViewOnMap() {
    if (!pendingFile) return;
    hideChoice();
    addLog('📖 Leyendo ' + pendingFile.name + '…');
    const text = await pendingFile.text();
    const doc  = new DOMParser().parseFromString(text, 'text/xml');
    const name = doc.querySelector('trk > name')?.textContent?.trim()
               || pendingFile.name.replace(/\.gpx$/i, '');
    const trkpts = [...doc.querySelectorAll('trkpt')];
    if (!trkpts.length) { addLog('✗ No se encontraron puntos en el fichero'); showClose(); return; }
    const pts = trkpts.map(p => [
      parseFloat(p.getAttribute('lat')),
      parseFloat(p.getAttribute('lon')),
      parseFloat(p.querySelector('ele')?.textContent || 0)
    ]);
    addLog('✓ ' + pts.length + ' puntos leídos — añadiendo al mapa…');
    const filename = pendingFile.name;
    closeModal();
    addTempTrack({ name, pts, gpxText: text, filename });
  }

  // ── Opción 2: importar al catálogo ──
  async function doImport() {
    if (!pendingFile) return;
    hideChoice();
    addLog('⬆ Subiendo ' + pendingFile.name + '…');

    const buf = await pendingFile.arrayBuffer();
    let uploaded;
    try {
      const r = await fetch('/api/import/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/gpx+xml', 'X-Filename': pendingFile.name },
        body: buf
      });
      uploaded = await r.json();
    } catch(e) {
      addLog('✗ Error subiendo: ' + e.message);
      showClose(); return;
    }
    if (!uploaded.ok) { addLog('✗ Error en servidor'); showClose(); return; }
    addLog('✓ Fichero guardado, iniciando importación…');

    let isErr = false;
    fetch('/api/db/import-temp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: [uploaded.filename], keep: true })
    }).then(resp => {
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf2 = '';
      function pump() {
        reader.read().then(({ done, value }) => {
          if (done) { finish(isErr); return; }
          buf2 += dec.decode(value, { stream: true });
          const parts = buf2.split('\n\n'); buf2 = parts.pop();
          for (const part of parts) {
            const dl = part.split('\n').find(l => l.startsWith('data:'));
            if (!dl) continue;
            try {
              const evt = JSON.parse(dl.slice(5));
              if (evt.type === 'log' || evt.type === 'progress') addLog(evt.text);
              if (evt.type === 'warn')  addLog('⚠ ' + evt.text);
              if (evt.type === 'error') { addLog('✗ ' + evt.text); isErr = true; }
              if (evt.type === 'done')  { isErr = evt.code !== 0; finish(isErr); return; }
            } catch {}
          }
          pump();
        }).catch(e => { addLog('✗ ' + e.message); finish(true); });
      }
      pump();
    }).catch(e => { addLog('✗ ' + e.message); finish(true); });

    async function finish(err) {
      importLogSummary(logEl, err);
      foot.style.display = 'flex';
      if (!err) {
        // find newly imported track by comparing catalog IDs with current compare list
        const knownIds = new Set(tracks.map(t => t.id).filter(Boolean));
        try {
          const cat = await fetch('/api/catalog').then(r => r.json());
          const newEntry = cat.slice().sort((a,b) => b.id - a.id).find(t => !knownIds.has(t.id));
          if (newEntry) {
            addLog('↻ Añadiendo al comparador…');
            const data = await fetch('/api/tracks/' + newEntry.id).then(r => r.json());
            const color = nextColor();
            const pts = (data.points || []).filter(p => p[0] && p[1]);
            if (pts.length > 1) {
              const poly = L.polyline(pts.map(p => [p[0],p[1]]), { color, weight:3, opacity:0.9 }).addTo(map);
              poly.on('click', () => { const idx = tracks.findIndex(t => t.polyline === poly); if (idx < 0) return; if (!profileOpen) highlightTrack(idx); else selectProfileTab(idx); });
              let profile = null, totalDist = 0;
              if (pts.some(p => p[2] != null)) {
                let cum = 0;
                const segs = pts.map((p,i) => { if (i>0) cum += hav(pts[i-1],p); return {e:p[2],cum}; });
                totalDist = cum || 1;
                profile = segs.map(s => ({ d: s.cum/totalDist, e: s.e }));
              }
              tracks.push({ id: data.id, data, color, polyline: poly, visible: true, profile, totalDist, rawPts: pts });
              setCount();
              buildList();
            }
          }
        } catch(e) { /* non-fatal */ }
        foot.innerHTML = '<button class="btn btn-primary" id="dnd-open-cat">Ver en catálogo</button>' +
                         '<button class="btn" id="dnd-done-btn">Cerrar</button>';
        document.getElementById('dnd-open-cat').onclick = () => { window.open('/editor?q=' + encodeURIComponent(newEntry.name), '_blank'); closeModal(); };
      } else {
        foot.innerHTML = '<button class="btn" id="dnd-done-btn">Cerrar</button>';
      }
      document.getElementById('dnd-done-btn').onclick = closeModal;
    }
  }

  function showClose() {
    foot.style.display = 'flex';
    foot.innerHTML = '<button class="btn" id="dnd-done-btn">Cerrar</button>';
    document.getElementById('dnd-done-btn').onclick = closeModal;
  }
})();
</script>
