# Garage (S3-compatible store for the original GPX files), single node for local development.
# Secrets come from the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN in .env), never from this file.
# First-time setup (layout, buckets, access key): node scripts/storage-setup.js
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
