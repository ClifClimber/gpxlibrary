<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas de varios días — GPX Library</title>
  <link rel="stylesheet" href="/shared.css">
  <script src="/theme.js"></script>
  <style>
    .page { max-width: 1180px; }
    .md-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .md-stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
    .md-stat .hs-ico { width: 42px; height: 42px; border-radius: 12px; }
    .md-stat-val { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .md-stat-lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
    .md-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
    .md-search { position: relative; flex: 1 1 200px; max-width: 280px; }
    .md-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
    .md-search .input { padding-left: 32px; height: 34px; }
    .md-toolbar .select { width: auto; height: 34px; padding-right: 28px; }
    .md-count { margin-left: auto; font-size: 13px; color: var(--muted); }
    .tbl-wrap { overflow-x: auto; }
    .table th { background: var(--hover-bg); }
    .table td a { color: var(--ink); font-weight: 600; text-decoration: none; }
    .table td a:hover { color: var(--accent); }
    .reason-tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
    .days-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 24px; padding: 0 8px; border-radius: 999px;
      font-weight: 700; background: var(--solid); color: var(--on-solid); }
    th.num, td.num { text-align: right; }
    .empty-msg { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
    @media (max-width: 700px) { .md-stats { grid-template-columns: 1fr; } .md-count { margin-left: 0; } }
  </style>
</head>
<body>

<nav>
  <span class="logo">GPX Library</span>
  <a href="/">Visor</a>
  <a href="/editor">Catálogo</a>
  <a href="/compare">Comparar</a>
  <a href="/admin" class="admin-only">Admin</a>
</nav>

<main class="page">
  <div class="page-hero">
    <span class="page-hero-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
    <div>
      <h1>Rutas de varios días</h1>
      <div class="page-sub">Detectadas automáticamente según la configuración de <a href="/admin#gami">Gamificación</a></div>
    </div>
    <div class="page-actions">
      <button class="btn btn-outline" id="btn-refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Actualizar</button>
    </div>
  </div>

  <section id="stats-card" hidden>
    <div class="md-stats" id="stats-grid"></div>
  </section>

  <section class="card">
    <div class="md-toolbar">
      <div class="md-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" type="search" id="f-search" placeholder="Buscar nombre…">
      </div>
      <select class="select" id="f-owner"><option value="">Todos los dueños</option></select>
      <select class="select" id="f-activity"><option value="">Todas las actividades</option></select>
      <select class="select" id="f-reason">
        <option value="">Todos los motivos</option>
        <option value="días con actividad">Horas del GPX</option>
        <option value="nombre">Nombre</option>
        <option value="tiempo en movimiento">Movimiento</option>
        <option value="distancia y desnivel">Estimación</option>
        <option value="declarado">Declarado</option>
      </select>
      <span class="md-count" id="md-count"></span>
    </div>
    <div class="card-body" style="padding:0">
      <div id="tbl-area">
        <div class="empty-msg">Cargando…</div>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
(async () => {
  let allRoutes = [];

  const REASON_LABEL = {
    'días con actividad': 'Horas del GPX',
    'nombre': 'Nombre',
    'tiempo en movimiento': 'Movimiento',
    'distancia y desnivel': 'Estimación',
    'declarado': 'Declarado',
  };

  function fmt(n) {
    if (n == null) return '—';
    return typeof n === 'number' ? n.toLocaleString('es-ES', { maximumFractionDigits: 1 }) : n;
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    document.getElementById('tbl-area').innerHTML = '<div class="empty-msg">Cargando…</div>';
    try {
      const d = await fetch('/api/admin/gamification/multiday').then(r => {
        if (!r.ok) throw new Error(r.statusText);
        return r.json();
      });
      allRoutes = d.multiDay;
      buildFilters(d);
      renderStats(d);
      renderTable();
    } catch (e) {
      document.getElementById('tbl-area').innerHTML = `<div class="empty-msg">Error: ${esc(e.message)}</div>`;
    }
  }

  function buildFilters(d) {
    const owners = [...new Set(d.multiDay.map(r => r.owner).filter(Boolean))].sort();
    const acts   = [...new Set(d.multiDay.map(r => r.activity).filter(Boolean))].sort();
    const oSel = document.getElementById('f-owner');
    const aSel = document.getElementById('f-activity');
    oSel.innerHTML = '<option value="">Todos los dueños</option>' + owners.map(o => `<option>${esc(o)}</option>`).join('');
    aSel.innerHTML = '<option value="">Todas las actividades</option>' + acts.map(a => `<option>${esc(a)}</option>`).join('');
  }

  function renderStats(d) {
    const card = document.getElementById('stats-card');
    const grid = document.getElementById('stats-grid');
    const total = d.multiDay.length;
    if (!total) { card.hidden = true; return; }
    const totalDays = d.multiDay.reduce((s, r) => s + (r.estDays || 0), 0);
    const maxDays   = Math.max(...d.multiDay.map(r => r.estDays || 0));
    const ico = p => `<span class="hs-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span>`;
    grid.innerHTML = [
      { val: total,     lbl: `rutas de varios días (de ${fmt(d.totalTracks)})`, ico: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>' },
      { val: totalDays, lbl: 'días estimados en total', ico: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>' },
      { val: maxDays,   lbl: 'días máx. de una ruta', ico: '<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>' },
    ].map(s => `<div class="md-stat">${ico(s.ico)}<div><div class="md-stat-val">${fmt(s.val)}</div><div class="md-stat-lbl">${esc(s.lbl)}</div></div></div>`).join('');
    card.hidden = false;
  }

  function renderTable() {
    const search = document.getElementById('f-search').value.trim().toLowerCase();
    const owner  = document.getElementById('f-owner').value;
    const act    = document.getElementById('f-activity').value;
    const reason = document.getElementById('f-reason').value;

    let rows = allRoutes.filter(r =>
      (!search || r.name.toLowerCase().includes(search)) &&
      (!owner  || r.owner === owner) &&
      (!act    || r.activity === act) &&
      (!reason || r.reason === reason)
    );

    document.getElementById('md-count').textContent = rows.length === allRoutes.length
      ? `${rows.length} rutas` : `${rows.length} de ${allRoutes.length}`;

    if (!rows.length) {
      document.getElementById('tbl-area').innerHTML = '<div class="empty-msg">Ninguna ruta coincide con los filtros.</div>';
      return;
    }

    document.getElementById('tbl-area').innerHTML = `
      <div class="tbl-wrap">
        <table class="table">
          <thead><tr>
            <th>Ruta</th>
            <th>Dueño</th>
            <th>Actividad</th>
            <th class="num">km</th>
            <th class="num">D+</th>
            <th class="num">h total</th>
            <th class="num">h estimadas</th>
            <th class="num">h movimiento</th>
            <th>Motivo</th>
            <th class="num">Días aprox.</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td><a href="/track?id=${r.id}" target="_blank">${esc(r.name)}</a></td>
              <td>${r.owner ? '@' + esc(r.owner) : '—'}</td>
              <td>${esc(r.activity || '—')}</td>
              <td class="num">${fmt(r.km)}</td>
              <td class="num">${fmt(r.gain)}</td>
              <td class="num">${r.elapsedHours ?? '—'}</td>
              <td class="num">${fmt(r.estHours)}</td>
              <td class="num">${r.movingHours ?? '—'}</td>
              <td><span class="reason-tag">${esc(REASON_LABEL[r.reason] || r.reason)}</span></td>
              <td class="num"><span class="days-pill">${r.estDays}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  document.getElementById('f-search').addEventListener('input', renderTable);
  document.getElementById('f-owner').addEventListener('change', renderTable);
  document.getElementById('f-activity').addEventListener('change', renderTable);
  document.getElementById('f-reason').addEventListener('change', renderTable);
  document.getElementById('btn-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
