# GPX Library completa: aplicación (app), worker de trabajos (worker), PostgreSQL + PostGIS (db)
# y almacén S3 Garage para los GPX (storage).
#   node scripts/storage-setup.js → primera vez: secretos de Garage en .env, buckets y clave
#   docker compose up -d --build  → construye la imagen y arranca todo → http://localhost:8081
#   docker compose up -d db       → solo PostgreSQL (para ejecutar la app fuera de Docker)
# La app del contenedor usa siempre PostgreSQL y S3; antes, copia los datos con
# node scripts/db-copy.js --to postgres y node scripts/blob-copy.js --to s3 (o desde Admin).
#   docker compose down         → para (los datos se conservan en los volúmenes)
#   docker compose down -v      → para y BORRA los datos
# Credenciales en .env (ver .env.example). Solo escucha en 127.0.0.1.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: gpxlibrary-db
    restart: unless-stopped
    # Parallel queries need shared memory; Docker's default /dev/shm (64 MB) runs out with large tables
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${PG_DB:-gpxlibrary}
      POSTGRES_USER: ${PG_USER:-gpx}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Define PG_PASSWORD en .env}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: dxflrs/garage:v2.4.1
    container_name: gpxlibrary-storage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${S3_PORT:-3900}:3900"
    volumes:
      - ./db/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: gpxlibrary-app:local
    container_name: gpxlibrary-app
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_HOST: db:5432
      S3_ENDPOINT: http://storage:3900
      LOCK_BACKENDS: "1"
      EMBEDDED_WORKER: "0"            # los trabajos los ejecuta el servicio worker
      LOCAL_SYNC_DIR: /sync
      PHOTOS_DIR: /app/photos
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    volumes:
      - appdata:/app/data
      - photodata:/app/photos
      - ${LOCAL_SYNC_DIR:-./TracksGps/local}:/sync
      - ./.env:/app/.env.host:rw
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  # Ejecuta los trabajos en cola (importar, OSM, IBP…). Comparte el volumen appdata con app
  # (_TEMP_, caché OSM, ajustes). Se puede escalar: docker compose up -d --scale worker=2
  worker:
    image: gpxlibrary-app:local
    restart: unless-stopped
    init: true
    command: ["sh", "-c", "mkdir -p data/_TEMP_ && exec node worker.js"]
    env_file: .env
    environment:
      DATABASE_HOST: db:5432
      S3_ENDPOINT: http://storage:3900
      LOCAL_SYNC_DIR: /sync
      PHOTOS_DIR: /app/photos
    volumes:
      - appdata:/app/data
      - photodata:/app/photos
      - ${LOCAL_SYNC_DIR:-./TracksGps/local}:/sync
      - ./.env:/app/.env.host:rw
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  pgdata:
  garage-meta:
  garage-data:
  appdata:
  photodata:
