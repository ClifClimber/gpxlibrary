<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track — GPX Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="/shared.css">
  <script src="/theme.js"></script>
  <script src="/icons.js"></script>
  <script src="/lists-picker.js"></script>

<body>

<nav>
  <span class="logo">GPX Library</span>
  <a href="/" class="active">Visor</a>
  <a href="/editor">Catálogo</a>
  <a href="/compare">Comparar</a>
  <a href="/admin">Admin</a>
  <a href="/perfil" id="nav-perfil" class="nav-user" title="Mi perfil"></a>
</nav>

<div id="app">
  <div id="map"></div>
  <div id="overlay">
    <aside id="panel" class="floating">
      <div id="panel-head">
        <div id="ph-top">
          <a id="back-link" class="icon-btn" href="/" title="Ver en el visor">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
          <span id="track-act"></span>
          <div id="ph-actions">
            <a class="ph-btn ph-icon" id="source-btn" target="_blank" rel="noopener" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
            <a class="ph-btn ph-icon" id="trace-btn" title="Editar trazado (crea una copia)" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="5" cy="18" r="2.5"/><circle cx="12" cy="7" r="2.5"/><circle cx="19" cy="14" r="2.5"/><path d="M6.6 16 10.6 9M14 8.5l3.6 4"/></svg>
            </a>
            <div id="list-wrap" hidden>
              <button class="ph-btn ph-icon" id="btn-add-list" title="Guardar en lista">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              </button>
            </div>
            <a class="ph-btn ph-icon" id="public-btn" title="Compartir / Página pública" target="_blank" hidden>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
            </a>
            <button class="ph-btn ph-icon" id="edit-btn" onclick="location.href='/subir?edit=' + gTrack.id" title="Editar ruta" hidden>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="ph-btn ph-icon" id="btn-report" title="Denunciar esta ruta" hidden onclick="openReportModal('track', gTrack.id)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
            </button>
            <a class="ph-btn primary" id="login-dl" hidden>Entrar para descargar el GPX</a>
            <div id="export-wrap" style="display:none">
              <button class="ph-btn primary" id="btn-export" title="Exportar GPX">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                GPX
              </button>
              <div id="export-dropdown" style="display:none">
                <button class="exp-opt" data-mode="full">Todos los puntos</button>
                <button class="exp-opt" data-mode="simplified">Resumido (500 pts)</button>
              </div>
            </div>
          </div>
        </div>
        <h1 id="track-title">Cargando…</h1>
        <div id="track-sub"></div>
        <div id="track-owner" hidden style="font-size:.82em;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:7px"></div>
      </div>
      <div id="content">
        <div id="loading"><div class="spin"></div>Cargando…</div>
      </div>
    </aside>

    <section id="profile-sheet" class="floating empty">
      <div id="ps-head">
        <span id="ps-title">Perfil de elevación</span>
        <span id="ps-hint">Arrastra para medir un tramo · doble clic para quitarlo</span>
      </div>
      <div id="road-bar-map" title="Tipos de camino"></div>
      <div id="profile-wrap"><svg id="profile-svg"></svg><div id="profile-tip"></div></div>
      <div id="sel-bar">
        <span id="sel-stats"></span>
        <button id="sel-clear">Quitar selección</button>
      </div>
    </section>
  </div>
</div>

<!-- Photo lightbox -->
<div id="photo-lb" class="photo-lb-overlay" hidden>
  <button class="photo-lb-close" onclick="closeLightbox()" title="Cerrar">

  </button>

  </button>
  <div class="photo-lb-img-wrap">
    <img id="photo-lb-img" src="" alt="">
  </div>
  <button class="photo-lb-next" onclick="lightboxNav(1)" title="Siguiente">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div class="photo-lb-footer">
    <span id="photo-lb-caption"></span>
    <span id="photo-lb-counter"></span>
  </div>
</div>

<script>
'use strict';

// ── Colores y etiquetas por actividad ────────────────────────────
const ACT = {
  'ciclismo':      { color: '#3b82f6', icon: '🚴' },
  'cycling':       { color: '#3b82f6', icon: '🚴' },
  'carretera':     { color: '#8b5cf6', icon: '🚴' },
  'road cycling':  { color: '#8b5cf6', icon: '🚴' },
  'btt':           { color: '#f97316', icon: '🚵' },
  'mtb':           { color: '#f97316', icon: '🚵' },
  'mountain bike': { color: '#f97316', icon: '🚵' },
  'senderismo':    { color: '#22c55e', icon: '🥾' },
  'hiking':        { color: '#22c55e', icon: '🥾' },
  'trail running': { color: '#ec4899', icon: '🏃' },
  'running':       { color: '#ec4899', icon: '🏃' },
};

let DB_ACT_COLORS = {};
function actInfo(a) {
  const base = (a && ACT[a.toLowerCase()]) || { color: '#006783', icon: '📍' };
  let custom = null;
  try { custom = JSON.parse(localStorage.getItem('gpx-act-colors') || '{}')[a]; } catch {}
  // Icon configured in Admin → Actividades (icons.js key), else the emoji
  const key = DB_ACT_ICONS[a];
  const icon = key && window.GPX_ICONS?.[key] ? gpxIcon(key, { size: 15 }) : esc(base.icon);
  return { color: custom || DB_ACT_COLORS[a] || base.color, icon };
}
let DB_ACT_ICONS = {};

const CYCLING_ACTS_T = ['MTB','MTB Enduro','Mtb','Gravel','Bikepacking','Ciclismo de carretera'];
const RUNNING_ACTS_T = ['Trail Running','Running'];
const IBP_LEVELS_T = [
  { label:'Muy fácil', desc:'Recorridos planos o con escaso desnivel acumulado.',           min:0,   max:50,       color:'#16a34a', bg:'color-mix(in srgb,#16a34a 12%,transparent)' },
  { label:'Fácil',     desc:'Rutas con desnivel y distancia moderados.',                    min:51,  max:100,      color:'#d97706', bg:'color-mix(in srgb,#d97706 12%,transparent)' },
  { label:'Moderada',  desc:'Exige buena condición física. Desnivel notable.',              min:101, max:150,      color:'#ea580c', bg:'color-mix(in srgb,#ea580c 12%,transparent)' },
  { label:'Dura',      desc:'Alta exigencia. Desnivel y distancia considerables.',          min:151, max:250,      color:'#dc2626', bg:'color-mix(in srgb,#dc2626 12%,transparent)' },
  { label:'Muy dura',  desc:'Solo para deportistas muy entrenados y preparados.',           min:251, max:400,      color:'#9333ea', bg:'color-mix(in srgb,#9333ea 12%,transparent)' },
  { label:'Extrema',   desc:'Alta montaña, gran fondo o rutas de expedición.',             min:401, max:Infinity,  color:'#64748b', bg:'color-mix(in srgb,#64748b 12%,transparent)' },
];

function ibpForTrackT(t) {
  if (CYCLING_ACTS_T.includes(t.activity)) return t.ibp_bicycle;
  if (RUNNING_ACTS_T.includes(t.activity)) return t.ibp_running;
  return t.ibp_hiking;
}

function ibpLevelT(val) {
  if (val == null) return null;
  return IBP_LEVELS_T.find(l => val >= l.min && val <= l.max) || null;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Author points this route gives its owner (public, non-planned routes; computed by the server)
const POINT_PARTS = { publish: 'Publicada', description: 'Descripción', waypoints: 'Puntos de paso', photos: 'Fotos', cover: 'Portada',
  tags: 'Etiquetas', ratings: 'Valoraciones', done: 'La han hecho', comments: 'Comentarios' };
const COMMUNITY_PARTS = new Set(['ratings', 'done', 'comments']);
function pointsSection(t) {
  const p = t.author_points;
  if (!p) return '';
  const chips = Object.entries(p.parts).map(([k, v]) =>
    `<span class="pt-chip${COMMUNITY_PARTS.has(k) ? ' c' : ''}">${esc(POINT_PARTS[k] || k)} <b>+${v}</b></span>`).join('');
  return `<div class="section" id="points-section">
    <div class="pts-head">
      <span class="pts-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
      <div style="flex:1;min-width:0"><div class="pts-total">${p.points} <small>puntos de autor</small></div>
        <div class="pts-sub">Lo que esta ruta da a su autor por su contenido y por lo que hacen otros con ella</div></div>
    </div>
    <div class="pts-chips">${chips}</div>
  </div>`;
}

// ── Puntos GPS anómalos (solo los ve quien puede actuar: el dueño y los administradores) ──────────────
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function anomalyText(a) {
  const parts = [];
  const stars = a.clusters.filter(c => c.kind !== 'phantom'), ph = a.clusters.filter(c => c.kind === 'phantom');
  const pts = l => l.reduce((s, c) => s + Math.max(0, c.count - 2), 0);
  if (stars.length) parts.push(`${plural(stars.length, 'parada', 'paradas')} con ruido GPS (${plural(pts(stars), 'punto', 'puntos')})`);
  if (ph.length) parts.push(`${plural(ph.length, 'excursión fantasma', 'excursiones fantasma')} (${plural(pts(ph), 'punto', 'puntos')})`);
  if (a.spikes.length) parts.push(`${plural(a.spikes.length, 'salto aislado', 'saltos aislados')}`);
  return parts.join(' · ');
}
const kmStr = n => Number(n).toLocaleString('es-ES', { maximumFractionDigits: 1 });
function anomalySection(t) {
  const a = t.anomalies;
  if (!a || window.GPX_ANON) return '';
  if (a.applied) {
    return `<div class="section anom anom-done" id="anom-section">
      <div class="anom-head"><span class="anom-ico">✓</span><div><b>Puntos anómalos quitados</b>
        <p>${plural(a.applied.removed, 'punto quitado', 'puntos quitados')}: la distancia pasó de ${kmStr(a.applied.before.distance)} a ${kmStr(t.distance)} km. El GPX original no se ha modificado.</p></div></div>
      <div class="anom-actions"><button class="btn btn-sm" onclick="anomAct('restore')">Restaurar el original</button></div></div>`;
  }
  if (!a.removable || a.dismissed) return '';
  const saved = a.savedM >= 50 ? `<p>Quitarlos reduciría la distancia en unos <b>${kmStr(a.savedM / 1000)} km</b> y corregiría el desnivel.</p>` : '';
  return `<div class="section anom" id="anom-section">
    <div class="anom-head"><span class="anom-ico">⚠</span><div><b>Puntos GPS anómalos</b>
      <p>${esc(anomalyText(a))}.</p>${saved}
      <p class="anom-note">Es solo un aviso: no se ha quitado nada, y el GPX original nunca se modifica.</p></div></div>
    <div class="anom-actions">
      <button class="btn btn-primary btn-sm" onclick="anomAct('clean')">Quitar puntos anómalos</button>
      <button class="btn btn-sm" id="anom-map-btn" onclick="anomToggleMap()">Ver en el mapa</button>
      <button class="btn btn-ghost btn-sm" onclick="anomAct('dismiss')">Ignorar</button>
    </div></div>`;
}
let gAnomLayer = null;
function anomToggleMap() {
  const btn = document.getElementById('anom-map-btn');
  if (gAnomLayer) { gAnomLayer.remove(); gAnomLayer = null; if (btn) btn.textContent = 'Ver en el mapa'; return; }
  const a = gTrack && gTrack.anomalies; if (!a || !gMap) return;
  gAnomLayer = L.featureGroup();
  a.clusters.forEach(c => L.circle([c.lat, c.lon], { radius: Math.max(c.radiusM * 1.6, 12), color: '#f59e0b', weight: 2, fillColor: '#f59e0b', fillOpacity: .25 })
    .bindTooltip(c.kind === 'phantom' ? `Excursión fantasma · ${c.radiusM} m de ida y vuelta con puntos interpolados` : `Parada con ruido GPS · ${c.count} puntos${c.seconds ? ` · ${Math.round(c.seconds / 60)} min` : ''}`).addTo(gAnomLayer));
  a.spikes.forEach(s => L.circleMarker([s.lat, s.lon], { radius: 7, color: '#dc2626', weight: 2, fillColor: '#dc2626', fillOpacity: .5 })
    .bindTooltip(`Salto aislado · ${s.jumpM} m fuera de la línea`).addTo(gAnomLayer));
  gAnomLayer.addTo(gMap);
  if (btn) btn.textContent = 'Ocultar del mapa';
  if (a.clusters.length + a.spikes.length === 1) gMap.setView(gAnomLayer.getBounds().getCenter(), 17);
  else gMap.fitBounds(gAnomLayer.getBounds(), { maxZoom: 16, padding: [40, 40] });
}
async function anomAct(action) {
  const a = gTrack && gTrack.anomalies;
  if (action === 'clean' && !confirm(`¿Quitar ${plural(a.removable, 'punto anómalo', 'puntos anómalos')}?\n\n` +
      `La línea del mapa se corrige y la distancia baja de ${kmStr(gTrack.distance)} a unos ${kmStr(gTrack.distance - a.savedM / 1000)} km. ` +
      `El GPX original no se modifica y podrás restaurarlo.`)) return;
  if (action === 'restore' && !confirm('¿Volver a los puntos originales de la ruta?')) return;
  try {
    const r = await fetch(`/api/tracks/${trackId}/anomalies`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showToast(d.error || 'No se pudo completar'); return; }
    if (action === 'dismiss') { document.getElementById('anom-section')?.remove(); showToast('Aviso ignorado'); return; }
    location.reload();   // line, profile and figures all change
  } catch { showToast('Error de red'); }
}

// Floating notice (#toast in shared.css)
function showToast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function hav(lat1, lon1, lat2, lon2) {
  const R = 6371, d = Math.PI / 180;
  const a = Math.sin((lat2-lat1)*d/2)**2
          + Math.cos(lat1*d) * Math.cos(lat2*d) * Math.sin((lon2-lon1)*d/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function fmt(n, dec = 0) {
  if (n == null) return '—';
  return (+n).toLocaleString('es-ES', { maximumFractionDigits: dec, minimumFractionDigits: dec });
}

// ── Tag suggestions ───────────────────────────────────────────────
let allTagsGlobal = [];
if (!window.GPX_ANON) fetch('/api/tags').then(r => (r.ok ? r.json() : [])).then(tags => { allTagsGlobal = tags; }).catch(() => {});

function initTagSuggestions() {
  const inp  = document.getElementById('tag-input');
  const box  = document.getElementById('tag-suggestions');
  if (!inp || !box) return;
  let focusIdx = -1;

  function positionBox() {
    const rect = inp.getBoundingClientRect();
    box.style.top  = (rect.bottom + 3) + 'px';
    box.style.left = rect.left + 'px';
    box.style.width = rect.width + 'px';
  }

  async function renderSuggestions(val) {
    if (!allTagsGlobal.length) {
      try { allTagsGlobal = await fetch('/api/tags').then(r => r.json()); } catch {}
    }
    const q = val.trim().toLowerCase().replace(/\s+/g, '-');
    const current = getTags();
    const matches = allTagsGlobal.filter(t => t !== val && (q === '' || t.includes(q)));
    if (!matches.length) { box.classList.remove('open'); return; }
    focusIdx = -1;
    box.innerHTML = matches.map(t => {
      const already = current.includes(t);
      return `<div class="tag-sug-item${already ? ' tag-sug-already' : ''}" data-tag="${esc(t)}">${esc(t)}${already ? ' ✓' : ''}</div>`;
    }).join('');
    positionBox();
    box.classList.add('open');
    box.querySelectorAll('.tag-sug-item:not(.tag-sug-already)').forEach(el => {
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        inp.value = el.dataset.tag;
        box.classList.remove('open');
        addTag();
      });
    });
  }

  inp.addEventListener('input', () => renderSuggestions(inp.value));
  inp.addEventListener('focus', () => renderSuggestions(inp.value));
  inp.addEventListener('blur',  () => setTimeout(() => box.classList.remove('open'), 150));
  document.getElementById('content')?.addEventListener('scroll', () => { if (box.classList.contains('open')) positionBox(); });
  inp.addEventListener('keydown', e => {
    const items = box.querySelectorAll('.tag-sug-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      focusIdx = Math.min(focusIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('focused', i === focusIdx));
      if (items[focusIdx]) inp.value = items[focusIdx].dataset.tag;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      focusIdx = Math.max(focusIdx - 1, -1);
      items.forEach((el, i) => el.classList.toggle('focused', i === focusIdx));
      if (focusIdx >= 0 && items[focusIdx]) inp.value = items[focusIdx].dataset.tag;
    } else if (e.key === 'Escape') {
      box.classList.remove('open');
    }
  });
}

// ── Load ─────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const trackId = window.GPX_TRACK_ID || parseInt(params.get('id'));   // /ruta/{id}-… sets GPX_TRACK_ID

if (!trackId) {
  document.getElementById('loading').innerHTML = '<p style="color:#ef4444">Falta el parámetro <code>?id=</code></p>';
} else {
  const actsP = fetch('/api/config/activities').then(r => r.json())
    .then(acts => {
      acts.forEach(a => {
        if (a.color) DB_ACT_COLORS[a.name] = a.color;
        if (a.icon) DB_ACT_ICONS[a.name] = a.icon;
      });
    })
    .catch(() => {});
  Promise.all([
    fetch(`/api/tracks/${trackId}`).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    actsP,
  ])
    .then(([t]) => {
      render(t);
      if (window.GPX_ANON) document.getElementById('login-dl').hidden = false;
      else { document.getElementById('export-wrap').style.display = ''; initTagSuggestions(); }
    })
    .catch(e => { document.getElementById('loading').innerHTML = `<p style="color:#ef4444">Error: ${esc(e.message)}</p>`; });
}

// ── Export GPX ───────────────────────────────────────────────────
const expBtn  = document.getElementById('btn-export');
const expDrop = document.getElementById('export-dropdown');
expBtn.addEventListener('click', e => { e.stopPropagation(); expDrop.style.display = expDrop.style.display === 'none' ? 'block' : 'none'; });
document.addEventListener('click', () => { expDrop.style.display = 'none'; });
document.querySelectorAll('.exp-opt').forEach(opt => {
  opt.addEventListener('mouseenter', function() { this.style.background = '#f8fafc'; });
  opt.addEventListener('mouseleave', function() { this.style.background = ''; });
  opt.addEventListener('click', async () => {
    expDrop.style.display = 'none';
    const mode = opt.dataset.mode;
    expBtn.textContent = '…';
    try {
      const resp = await fetch('/api/tracks/export-gpx', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [trackId], mode, pts: 500 }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const blob = await resp.blob();
      const cd   = resp.headers.get('Content-Disposition') || '';
      const m    = cd.match(/filename\*?=(?:UTF-8'')?(.+)/i);
      const name = m ? decodeURIComponent(m[1].replace(/"/g,'')) : `track-${trackId}.gpx`;
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
    } catch(e) { alert('Error: ' + e.message); }
    finally {
      expBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> GPX';
    }
  });
});

// ── Fotos del track ──────────────────────────────────────────────
async function loadTrackPhotos(id, ownerId) {
  try {
    const [photos, me] = await Promise.all([
      fetch(`/api/tracks/${id}/photos`).then(r => r.ok ? r.json() : []),
      fetch('/api/auth/me').then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    if (!photos.length) return;
    const canEdit = !!me && (me.role === 'admin' || me.id === ownerId);
    photos.sort((a, b) => (b.is_cover ? 1 : 0) - (a.is_cover ? 1 : 0));   // cover first
    gLbPhotos = photos;
    let strip = document.getElementById('track-photos');
    if (!strip) {
      strip = document.createElement('div');
      strip.id = 'track-photos';
      document.getElementById('content').insertAdjacentElement('afterbegin', strip);
    }
    strip.innerHTML = photos.map((p, i) => `<div class="tp-ph${p.is_cover ? ' is-cover' : ''}">
        <div class="tp-img-click" onclick="openPhotoLightbox(${i})"><img src="${esc(p.thumb || p.url)}" alt="${esc(p.caption || '')}" loading="lazy"></div>
        ${p.is_cover ? '<span class="tp-cover">★ Portada</span>'
          : canEdit ? `<button class="tp-set-cover" data-photo="${p.id}" title="Usar como portada">☆ Portada</button>` : ''}
      </div>`).join('');
    strip.onclick = async e => {
      const b = e.target.closest('.tp-set-cover'); if (!b) return;
      const r = await fetch(`/api/tracks/${id}/cover`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ photo_id: +b.dataset.photo }) });
      if (r.ok) loadTrackPhotos(id, ownerId);
    };
  } catch {}
}

function openPhotoLightbox(idx) {

function lightboxNav(dir) {

function updateLightbox() {
  const p = gLbPhotos[gLbIdx];

// ── Render ───────────────────────────────────────────────────────
function updateMapBar(t) {
  const bar = document.getElementById('road-bar-map');
  if (!bar || !t.road_types) return;
  let data;
  try { data = JSON.parse(t.road_types); } catch { return; }
  const entries = Object.entries(data)
    .filter(([k, km]) => k !== 'unknown' && km > 0.05)
    .sort(([,a],[,b]) => b - a);
  if (!entries.length) return;
  const total = entries.reduce((s,[,km]) => s + km, 0);
  bar.innerHTML = entries.map(([type, km]) => {
    const m = HW_META[type] || { label: type, color: '#ccc' };
    const pct = (km / total * 100).toFixed(2);
    const kmStr = km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
    return `<div class="type-seg" style="width:${pct}%;background:${m.color}" title="${esc(m.label)}: ${kmStr}"></div>`;
  }).join('');
}

function render(t) {
  gTrack = t;
  const { color, icon } = actInfo(t.activity);
  gColor = color;
  document.title = `${t.name} — GPX Library`;
  document.documentElement.style.setProperty('--tc', color);

  // Header
  updateHeader(t);
  // Only the owner or an admin may edit (the server enforces it as well)
  fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(me => {
    if (!me) return;
    if (me.role === 'admin' || me.id === t.owner_id) { document.getElementById('edit-btn').hidden = false; document.body.classList.add('can-edit'); }
    document.getElementById('list-wrap').hidden = false;   // any logged-in user can add to their lists
    refreshListSaved();
    if (me.id !== t.owner_id) document.getElementById('btn-report').hidden = false;  // non-owners can report
  }).catch(() => {});
  const traceBtn = document.getElementById('trace-btn');
  traceBtn.href = `/trazar?id=${t.id}`; traceBtn.hidden = !!window.GPX_ANON;
  document.getElementById('login-dl').href = `/login?next=${encodeURIComponent(location.pathname)}`;
  if (t.id) document.getElementById('back-link').href = `/?id=${t.id}`;
  if (t.id && t.visibility === 'public') {
    const pb = document.getElementById('public-btn');
    const slug = String(t.name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ñ/g, 'n')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70).replace(/-+$/, '');
    pb.href = `/ruta/${t.id}${slug ? '-' + slug : ''}`;
    pb.hidden = false;
    if (location.pathname.startsWith('/ruta/')) pb.addEventListener('click', e => {
      e.preventDefault();
      const url = location.origin + pb.getAttribute('href');
      if (navigator.share) { navigator.share({ title: t.name, url }).catch(() => {}); return; }
      const label = pb.lastChild, prev = label.textContent;
      navigator.clipboard.writeText(url).then(() => { label.textContent = ' ¡Enlace copiado!'; setTimeout(() => { label.textContent = prev; }, 1800); },
        () => prompt('Copia el enlace:', url));
    });
  }

  const hasEle = t.points && t.points.some(p => p[2] != null);
  document.getElementById('profile-sheet').classList.toggle('empty', !hasEle);

  // Map (capture map + line for hover sync)
  const mi = initMap(t, color);
  gMap = mi.map; gLine = mi.line;
  requestAnimationFrame(() => fitTrack(t));

  // Content
  document.getElementById('loading').remove();
  document.getElementById('content').insertAdjacentHTML('afterbegin', buildContent(t, color, icon));

  // Fotos del track (subidas desde el asistente Upload Trail)
  loadTrackPhotos(t.id, t.owner_id);

  // Comentarios
  loadComments();

  // Endpoint markers (always visible)
  requestAnimationFrame(() => showEndpointMarkers());

  // Road bar (div exists in DOM now)
  updateMapBar(t);

  if (hasEle) requestAnimationFrame(() => drawProfile(t, color));
}

function mapPadding() {

}

}

// ── Map ──────────────────────────────────────────────────────────
function initMap(t, color) {
  const map = L.map('map', { zoomControl: false });
  const tileLayers = {
    'OpenStreetMap':   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom:19 }),
    'Stadia Outdoors': L.tileLayer('https://tiles.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png', { attribution:'© <a href="https://stadiamaps.com/">Stadia Maps</a> © <a href="https://openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/about">OpenStreetMap</a>', maxZoom:20 }),
    'OpenTopoMap':     L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',   { attribution:'© OpenTopoMap', maxZoom:17 }),
    'IGN Topográfico': L.tileLayer('https://www.ign.es/wmts/mapa-raster?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=MTN&STYLE=default&FORMAT=image/jpeg&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', { attribution:'© <a href="https://www.ign.es">IGN España</a>', maxZoom:20 }),
    'Google Maps':     L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { subdomains:'0123', attribution:'© Google', maxZoom:20 }),
    'Google Satélite': L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { subdomains:'0123', attribution:'© Google', maxZoom:20 }),
    'Google Híbrido':  L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { subdomains:'0123', attribution:'© Google', maxZoom:20 }),
  };
  let baseName = 'OpenStreetMap';
  try { const s = localStorage.getItem('visor-base-layer'); if (tileLayers[s]) baseName = s; } catch {}
  tileLayers[baseName].addTo(map);
  map.on('baselayerchange', e => { try { localStorage.setItem('visor-base-layer', e.name); } catch {} });
  L.control.layers(tileLayers, null, { position:'topright', collapsed:true }).addTo(map);
  L.control.zoom({ position:'topright' }).addTo(map);

  if (!t.points || t.points.length < 2) {
    if (t.center_lat) map.setView([t.center_lat, t.center_lon], 13);
    return { map, line: null };
  }

  const lls = t.points.map(p => [p[0], p[1]]);
  L.polyline(lls, { color:'#111', weight:6, opacity:0.75, lineCap:'round', lineJoin:'round', interactive:false }).addTo(map);
  const line = L.polyline(lls, { color, weight:3.5, opacity:1, lineCap:'round', lineJoin:'round' }).addTo(map);

  const mk = (bg, sz=14) => L.divIcon({
    html: `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg};border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>`,
    className: '', iconSize: [sz,sz], iconAnchor: [sz/2,sz/2]
  });
  L.marker(lls[0], { icon: mk('#22c55e', 14), zIndexOffset: 10 }).addTo(map);
  L.marker(lls[lls.length-1], { icon: mk('#ef4444', 14), zIndexOffset: 10 }).addTo(map);

  map.fitBounds(t.bounds && t.bounds[0] ? t.bounds : L.latLngBounds(lls), { padding: [30,30] });
  if (t.privacy_hidden) map.attributionControl.addAttribution('Inicio y final ocultos por privacidad');
  return { map, line };
}

// ── Gradient map & road-type overlay ─────────────────────────────
function gradColorDown(pct) {
  if (pct <  3) return '#7dd3fc';
  if (pct <  6) return '#38bdf8';
  if (pct <  9) return '#0ea5e9';
  if (pct < 12) return '#0284c7';
  return '#0369a1';
}

function showGradientMap(pts) {
  clearClimbLayers();
  if (!pts || pts.length < 2 || !gMap) return;
  gClimbLayers = L.layerGroup();

  for (let i = 0; i < pts.length - 1; i++) {
    if (pts[i][2] == null || pts[i+1][2] == null) continue;
    const dist = hav(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]);
    if (dist < 0.0005) continue;
    const eleDiff = pts[i+1][2] - pts[i][2];
    const grad = Math.min(40, Math.abs(eleDiff / (dist * 1000)) * 100);
    const color = eleDiff > 0.5 ? gradColor(grad) : (eleDiff < -0.5 ? gradColorDown(grad) : '#94a3b8');
    L.polyline([[pts[i][0], pts[i][1]], [pts[i+1][0], pts[i+1][1]]], {
      color, weight: 5, opacity: 0.9
    }).addTo(gClimbLayers);
  }

  for (const c of gClimbs) {
    const lls = pts.slice(c.i1, c.i2 + 1).map(p => [p[0], p[1]]);
    if (lls.length < 2) continue;
    const mid = lls[Math.floor(lls.length / 2)];
    const gc  = gradColor(c.grad);
    L.marker(mid, {
      icon: L.divIcon({
        html: `<div style="background:${gc};color:#fff;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)">▲${c.grad}%</div>`,
        className: '', iconAnchor: [20, 10],
      })
    }).addTo(gClimbLayers);
  }

  if (gLine) gLine.setStyle({ opacity: 0.15 });
  gClimbLayers.addTo(gMap);
}

function clearClimbLayers() {
  if (gClimbLayers) { gClimbLayers.remove(); gClimbLayers = null; }
  if (gLine) gLine.setStyle({ opacity: 0.9 });
  gClimbMapVisible = false;
  clearClimbBands();
}

function showRoadTypesOnMap(t) {
  clearRoadTypeLayers();
  if (!t.road_type_seq || !t.points || t.points.length < 2 || !gMap) return;
  let roadSegs;
  try { roadSegs = JSON.parse(t.road_type_seq); } catch { return; }

  const pts = t.points;
  const dists = [0];
  for (let i = 1; i < pts.length; i++)
    dists.push(dists[i-1] + hav(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]));
  const total = dists[dists.length - 1] || 1;
  const fracs = dists.map(d => d / total);

  gRoadTypeLayers = L.layerGroup();
  for (const seg of roadSegs) {
    if (seg.t === 'unknown') continue;
    const m = HW_META[seg.t];
    if (!m) continue;
    const i0 = fracs.findIndex(f => f >= seg.f0 - 0.005);
    let i1 = -1;
    for (let i = fracs.length - 1; i >= 0; i--) { if (fracs[i] <= seg.f1 + 0.005) { i1 = i; break; } }
    if (i0 === -1 || i1 === -1 || i1 <= i0) continue;
    const segPts = pts.slice(i0, i1 + 1).map(p => [p[0], p[1]]);
    if (segPts.length < 2) continue;
    const pl = L.polyline(segPts, { color: m.color, weight: 6, opacity: 0.85 });
    pl._roadType = seg.t;
    pl.addTo(gRoadTypeLayers);
  }
  if (gLine) gLine.setStyle({ opacity: 0.15 });
  gRoadTypeLayers.addTo(gMap);
}

function clearRoadTypeLayers() {
  if (gRoadTypeLayers) { gRoadTypeLayers.remove(); gRoadTypeLayers = null; }
  if (gLine) gLine.setStyle({ opacity: 0.9 });
  gRoadTypeMapVisible = false;
}

function toggleRoadTypesOnMap() {
  const btn = document.getElementById('road-map-btn');
  if (gRoadTypeMapVisible) {
    clearRoadTypeLayers();
    if (btn) { btn.textContent = 'Mostrar en mapa'; btn.classList.remove('active'); }
  } else {
    if (gTrack?.road_type_seq) showRoadTypesOnMap(gTrack);
    gRoadTypeMapVisible = true;
    if (btn) { btn.textContent = 'Ocultar del mapa'; btn.classList.add('active'); }
  }
}

function symIcon(sym) {
  const s = (sym || '').toLowerCase();
  if (s.includes('summit') || s.includes('peak'))     return '⛰️';
  if (s.includes('camp'))                              return '⛺';
  if (s.includes('food') || s.includes('restaurant')) return '🍽️';
  if (s.includes('water') || s.includes('drink'))     return '💧';
  if (s.includes('parking'))                           return '🅿️';
  if (s.includes('photo'))                             return '📷';
  if (s.includes('flag'))                              return '🚩';
  if (s.includes('danger') || s.includes('warning'))  return '⚠️';
  return '📍';
}

    const lls = gElePts.slice(c.i1, c.i2 + 1).map(p => [p[0], p[1]]);
    if (lls.length < 2) continue;
    L.polyline(lls, { color: gradColor(c.grad), weight: 6, opacity: 0.9 }).addTo(gClimbLayers);
  }
  if (gLine) gLine.setStyle({ opacity: 0.55 });
  gClimbLayers.addTo(gMap);
  gClimbMapVisible = true;
}

function showClimbsOnProfile() {
  if (!gEleDists || !gProfileParams || !gClimbs.length) return;
  const svgEl = document.getElementById('profile-svg');
  if (!svgEl) return;
  const old = document.getElementById('climb-bands');
  if (old) old.remove();
  const { l, t, CW, CH, totalDist } = gProfileParams;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.id = 'climb-bands';
  for (const c of gClimbs) {
    const d1 = gEleDists[Math.min(c.i1, gEleDists.length - 1)] ?? 0;
    const d2 = gEleDists[Math.min(c.i2, gEleDists.length - 1)] ?? totalDist;
    const x1 = l + (d1 / totalDist) * CW;
    const x2 = l + (d2 / totalDist) * CW;
    const gc = gradColor(c.grad);
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x',            x1.toFixed(1));
    rect.setAttribute('y',            t);
    rect.setAttribute('width',        Math.max(2, x2 - x1).toFixed(1));
    rect.setAttribute('height',       CH);
    rect.setAttribute('fill',         gc);
    rect.setAttribute('fill-opacity', '0.18');
    rect.setAttribute('stroke',       gc);
    rect.setAttribute('stroke-opacity', '0.6');
    rect.setAttribute('stroke-width', '1.2');
    rect.setAttribute('rx',           '1');
    rect.setAttribute('pointer-events', 'none');
    g.appendChild(rect);
  }
  const climbRect = document.getElementById('climb-rect');
  if (climbRect) svgEl.insertBefore(g, climbRect);
  else           svgEl.appendChild(g);
}

function clearClimbBands() {
  const g = document.getElementById('climb-bands');
  if (g) g.remove();
}

function toggleClimbsOnMap() {
  const btn = document.getElementById('climbs-map-btn');
  if (gClimbMapVisible) {
    clearClimbLayers();   // also clears profile bands

// ── Climb detection ───────────────────────────────────────────────
function gradColor(pct) {
  if (pct <  3) return '#22c55e';  // verde
  if (pct <  6) return '#eab308';  // amarillo
  if (pct <  9) return '#f97316';  // naranja
  if (pct < 12) return '#ef4444';  // rojo
  return '#991b1b';                 // rojo oscuro
}

function formatDur(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}min`;
  return `${m}min ${String(Math.floor(s % 60)).padStart(2,'0')}s`;
}

function detectClimbs(pts) {
  // Build elevation-indexed array
  const ep = [];
  for (let i = 0; i < pts.length; i++) {
    if (pts[i][2] == null) continue;
    const prev = ep[ep.length - 1];
    const d = prev ? prev.d + hav(pts[prev.pi][0], pts[prev.pi][1], pts[i][0], pts[i][1]) : 0;
    ep.push({ pi: i, ei: ep.length, ele: pts[i][2], d });
  }
  if (ep.length < 10) return [];

  // Smooth elevation (7-point moving average)
  const W = 7;
  const sm = ep.map((p, i) => {
    const s = Math.max(0, i - W), e = Math.min(ep.length - 1, i + W);
    return ep.slice(s, e + 1).reduce((a, q) => a + q.ele, 0) / (e - s + 1);
  });

  // Zigzag peak/valley detection
  const NOISE = 10;
  const events = [];
  let refI = 0, refE = sm[0], mode = null;
  for (let i = 1; i < sm.length; i++) {
    if (sm[i] > refE + NOISE) {
      if (mode === 'dn') events.push({ type: 'v', i: refI });
      mode = 'up'; refI = i; refE = sm[i];
    } else if (sm[i] < refE - NOISE) {
      if (mode === 'up') events.push({ type: 'p', i: refI });
      mode = 'dn'; refI = i; refE = sm[i];
    } else {
      if (mode === 'up' && sm[i] > refE) { refI = i; refE = sm[i]; }
      else if (mode === 'dn' && sm[i] < refE) { refI = i; refE = sm[i]; }
    }
  }
  if (mode === 'up') events.push({ type: 'p', i: refI });
  else              events.push({ type: 'v', i: refI });

  const all = [{ type: 'v', i: 0 }, ...events];
  let _p = { minGain: 70, minGrad: 3.5, minDist: 0.2 };
  try { Object.assign(_p, JSON.parse(localStorage.getItem('gpx-climb-params-v2') || '{}')); } catch {}
  const MIN_DIST = _p.minDist, MIN_GAIN = _p.minGain, MIN_GRAD = _p.minGrad;

  // Average gradient (%) over a forward window of LOOK km from index k
  const LOOK = 0.5, TRIM = 2.5, MIN_TRIM = 2;
  const fwdGrad = (k, limit) => {
    let f = k + 1;
    while (f < limit && ep[f].d - ep[k].d < LOOK) f++;
    const d = ep[f].d - ep[k].d;
    return d > 0 ? (ep[f].ele - ep[k].ele) / d / 10 : 0;
  };

  const climbs = [];
  for (let j = 0; j + 1 < all.length; j++) {
    const a = all[j], b = all[j + 1];
    if (a.type !== 'v' || b.type !== 'p') continue;

    // Lowest point in the valley→peak window
    let lo = a.i;
    for (let k = a.i + 1; k < b.i; k++) if (ep[k].ele < ep[lo].ele) lo = k;

    // Trim start: skip flat run-in until sustained uphill begins
    let s = lo;
    while (s < b.i - 1 && fwdGrad(s, b.i) < TRIM) s++;

    // Trim end: last point still climbing, then extend to the nearby local max
    let e = s;
    for (let k = s; k < b.i; k++) if (fwdGrad(k, b.i) >= TRIM) e = k;
    let peakI = e;
    for (let k = e; k <= b.i; k++) {
      if (ep[k].ele > ep[peakI].ele) peakI = k;
      if (ep[k].d - ep[e].d > LOOK * 2) break;
    }

    // Qualify the climb on its steep core, so a flat approach can't dilute it
    const coreGain = ep[peakI].ele - ep[s].ele;
    const coreDist = ep[peakI].d - ep[s].d;
    const coreGrad = coreDist > 0 ? coreGain / coreDist / 10 : 0;
    if (coreDist < MIN_DIST || (coreGain < MIN_GAIN && coreGrad < MIN_GRAD)) continue;

    // A short run-in reads as part of the climb; only a long flat drag stays cut
    if (ep[s].d - ep[lo].d < MIN_TRIM) s = lo;

    const gain = ep[peakI].ele - ep[s].ele;
    const dist = ep[peakI].d - ep[s].d;
    const grad = dist > 0 ? gain / dist / 10 : 0;
    climbs.push({
      i1:   s, i2: peakI,
      gain: Math.round(gain),
      km:   Math.round(dist * 100) / 100,
      grad: Math.round(grad * 10) / 10,
    });
  }
  return climbs;
}

function buildTypeSection(dataStr, meta) {
  if (!dataStr) return null;
  let data;
  try { data = JSON.parse(dataStr); } catch { return null; }
  const entries = Object.entries(data)
    .filter(([k, km]) => k !== 'unknown' && km > 0.05)
    .sort(([,a],[,b]) => b - a);
  if (!entries.length) return null;
  const total = entries.reduce((s,[,km]) => s + km, 0);
  const bar = entries.map(([type, km]) => {
    const m = meta[type] || { label: type, color: '#cccccc' };
    const pct = (km / total * 100).toFixed(1);
    return `<div class="type-seg" style="width:${pct}%;background:${m.color}" title="${esc(m.label)}: ${km < 1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km'}"></div>`;
  }).join('');
  const list = entries.map(([type, km]) => {
    const m = meta[type] || { label: type, color: '#cccccc' };
    const kmStr = km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
    return `<div class="type-row" data-type="${esc(type)}" onclick="highlightRoadType('${esc(type)}')" title="Resaltar en mapa"><div class="type-swatch" style="background:${m.color}"></div><div class="type-label">${esc(m.label)}:</div><div class="type-km">${kmStr}</div></div>`;
  }).join('');
  return `<div class="type-bar">${bar}</div><div class="type-list">${list}</div>`;
}

// ── Elevation profile ─────────────────────────────────────────────
function drawProfile(t, color) {
  const svgEl = document.getElementById('profile-svg');
  if (!svgEl) return;

  gElePts = t.points.filter(p => p[2] != null);
  const pts = gElePts;
  if (pts.length < 2) return;

  const dists = [0];
  for (let i = 1; i < pts.length; i++)
    dists.push(dists[i-1] + hav(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]));
  const totalDist = dists[dists.length-1] || 1;
  const eles = pts.map(p => p[2]);
  const minE = Math.min(...eles), maxE = Math.max(...eles), rngE = (maxE - minE) || 1;

  const rect = svgEl.getBoundingClientRect();
  const W = rect.width || 700, H = 150;
  const P = { t: 10, r: 14, b: 24, l: 46 };
  const CW = W - P.l - P.r, CH = H - P.t - P.b;
  gEleDists = dists;
  gProfileParams = { l: P.l, t: P.t, CW, CH, totalDist };
  const toX = d => P.l + (d / totalDist) * CW;
  const toY = e => P.t + (1 - (e - minE) / rngE) * CH;

  const coords = eles.map((e, i) => [toX(dists[i]), toY(e)]);
  const lineD = 'M' + coords.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L');
  const areaD = `M${P.l},${P.t+CH} L${coords.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L')} L${(P.l+CW).toFixed(1)},${P.t+CH} Z`;

  const nY = 5;
  const yTicks = Array.from({ length: nY }, (_, i) => {
    const f = i / (nY - 1);
    return { y: toY(minE + f * rngE), val: Math.round(minE + f * rngE) };
  });

  const rawStep = totalDist / 5;
  const xStep = rawStep >= 20 ? Math.ceil(rawStep/10)*10 : rawStep >= 5 ? 5 : rawStep >= 2 ? 2 : 1;
  const xTicks = [];
  for (let d = 0; d <= totalDist + 0.001; d += xStep)
    if (toX(d) <= P.l + CW + 1) xTicks.push({ x: toX(d), val: +d.toFixed(1) });

  const gid = 'pg' + Math.random().toString(36).slice(2);
  const [cr, cg, cb] = color.match(/#(..)(..)(..)/).slice(1).map(h => parseInt(h,16));

  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgEl.style.height = H + 'px';
  svgEl.innerHTML = `
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="rgb(${cr},${cg},${cb})" stop-opacity=".35"/>
        <stop offset="100%" stop-color="rgb(${cr},${cg},${cb})" stop-opacity=".03"/>
      </linearGradient>
    </defs>
    ${yTicks.map(k => `
      <line x1="${P.l}" y1="${k.y.toFixed(1)}" x2="${P.l+CW}" y2="${k.y.toFixed(1)}" stroke="#eef2f6" stroke-width="1"/>
      <text x="${P.l-6}" y="${(k.y+4).toFixed(1)}" text-anchor="end" font-size="10" fill="#94a3b8">${k.val}</text>
    `).join('')}
    ${xTicks.map(k => `
      <line x1="${k.x.toFixed(1)}" y1="${P.t+CH}" x2="${k.x.toFixed(1)}" y2="${P.t+CH+4}" stroke="#cbd5e1" stroke-width="1"/>
      <text x="${k.x.toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="10" fill="#94a3b8">${k.val} km</text>
    `).join('')}
    <path d="${areaD}" fill="url(#${gid})"/>
    <path d="${lineD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <rect id="sel-rect" x="${P.l}" y="${P.t}" width="0" height="${CH}" fill="rgba(59,130,246,.12)" stroke="rgba(59,130,246,.45)" stroke-width="1" opacity="0" pointer-events="none"/>
    <rect id="climb-rect" x="${P.l}" y="${P.t}" width="0" height="${CH}" fill="rgba(251,146,60,.18)" stroke="rgba(234,88,12,.55)" stroke-width="1.5" rx="2" opacity="0" pointer-events="none"/>
    <line id="ph-line" x1="0" y1="${P.t}" x2="0" y2="${P.t+CH}" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3" opacity="0" pointer-events="none"/>
    <circle id="ph-dot" cx="0" cy="0" r="4.5" fill="white" stroke="${color}" stroke-width="2" opacity="0" pointer-events="none"/>
    <rect id="ph-area" x="${P.l}" y="${P.t}" width="${CW}" height="${CH}" fill="transparent" style="cursor:crosshair"/>
  `;

  const tip = document.getElementById('profile-tip');
  const phL = document.getElementById('ph-line');
  const phD = document.getElementById('ph-dot');
  const phA = document.getElementById('ph-area');

  // ── Shared helpers ────────────────────────────────────────────
  function showHover(best) {
    const ex = coords[best][0], ey = coords[best][1];
    phL.setAttribute('x1', ex); phL.setAttribute('x2', ex); phL.setAttribute('opacity','1');
    phD.setAttribute('cx', ex); phD.setAttribute('cy', ey); phD.setAttribute('opacity','1');
    const svgR = svgEl.getBoundingClientRect();
    const wrapR = document.getElementById('profile-wrap').getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = (svgR.left - wrapR.left + ex) + 'px';
    tip.style.top  = (svgR.top  - wrapR.top  + ey) + 'px';
    tip.textContent = `${Math.round(eles[best])} m  ·  ${dists[best].toFixed(1)} km`;
  }

  function hideHover() {
    phL.setAttribute('opacity','0'); phD.setAttribute('opacity','0');
    tip.style.display = 'none';
  }

  function moveMapMarker(best) {
    const ll = [pts[best][0], pts[best][1]];
    if (!gHoverMk) {
      gHoverMk = L.circleMarker(ll, {
        radius: 7, color, weight: 2.5,
        fillColor: '#fff', fillOpacity: 1,
      }).addTo(gMap);
    } else {
      gHoverMk.setLatLng(ll);
    }
  }

  function removeMapMarker() {
    if (gHoverMk) { gHoverMk.remove(); gHoverMk = null; }
  }

  // ── Profile → map ─────────────────────────────────────────────
  phA.addEventListener('mousemove', e => {
    const r    = svgEl.getBoundingClientRect();
    const mx   = Math.max(P.l, Math.min(P.l + CW, e.clientX - r.left));
    const dAt  = ((mx - P.l) / CW) * totalDist;
    let best = 0;
    for (let i = 1; i < dists.length; i++)
      if (Math.abs(dists[i] - dAt) < Math.abs(dists[best] - dAt)) best = i;
    showHover(best);
    if (gMap) moveMapMarker(best);
  });
  phA.addEventListener('mouseleave', () => {
    hideHover();
    removeMapMarker();
  });

  // ── Map → profile ─────────────────────────────────────────────
  if (gLine) {
    gLine.off('mousemove').off('mouseout');
    gLine.on('mousemove', e => {
      const ll = e.latlng;
      let best = 0, bestD2 = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const dlat = ll.lat - pts[i][0], dlon = ll.lng - pts[i][1];
        const d2 = dlat*dlat + dlon*dlon;
        if (d2 < bestD2) { bestD2 = d2; best = i; }
      }
      showHover(best);
    });
    gLine.on('mouseout', hideHover);
  }

  // ── Drag-to-zoom on profile ────────────────────────────────────
  const selRect = document.getElementById('sel-rect');
  const selBar  = document.getElementById('sel-bar');
  const selStats = document.getElementById('sel-stats');
  const selClear = document.getElementById('sel-clear');
  let selAnchor = null;   // SVG x where drag started

  function xToIdx(svgX) {
    const frac = (Math.max(P.l, Math.min(P.l + CW, svgX)) - P.l) / CW;
    const dAt  = frac * totalDist;
    let best = 0;
    for (let i = 1; i < dists.length; i++)
      if (Math.abs(dists[i] - dAt) < Math.abs(dists[best] - dAt)) best = i;
    return best;
  }

  function showSelBar(i1, i2) {
    const segPts = pts.slice(i1, i2 + 1);
    let segDist = 0, segGain = 0, segLoss = 0;
    for (let i = 1; i < segPts.length; i++) {
      segDist += hav(segPts[i-1][0], segPts[i-1][1], segPts[i][0], segPts[i][1]);
      const de = segPts[i][2] - segPts[i-1][2];
      if (de > 0) segGain += de; else segLoss -= de;
    }
    selStats.textContent = `${segDist.toFixed(1)} km  ·  ↑${Math.round(segGain)} m  ↓${Math.round(segLoss)} m`;
    selBar.style.display = 'flex';
  }

  phA.addEventListener('mousedown', e => {
    const r = svgEl.getBoundingClientRect();
    selAnchor = e.clientX - r.left;
    selRect.setAttribute('x', selAnchor); selRect.setAttribute('width', 0);
    selRect.setAttribute('opacity', '1');
  });

  // ── Live segment highlight ────────────────────────────────────────
  function applyHL(x1, x2) {
    if (x2 - x1 < 4) return;
    const i1 = xToIdx(x1), i2 = xToIdx(x2);
    if (i1 >= i2) return;
    hlByIdx(i1, i2);
    showSelBar(i1, i2);
  }

  let lastX1 = 0, lastX2 = 0, rafPending = false;

  phA.addEventListener('mousemove', e => {
    if (selAnchor === null) return;
    const r  = svgEl.getBoundingClientRect();
    const mx = e.clientX - r.left;
    lastX1 = Math.min(selAnchor, mx); lastX2 = Math.max(selAnchor, mx);
    selRect.setAttribute('x', lastX1); selRect.setAttribute('width', lastX2 - lastX1);
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(() => { rafPending = false; applyHL(lastX1, lastX2); });
    }
  });

  function commitSel(endX) {
    if (selAnchor === null) return;
    const r  = svgEl.getBoundingClientRect();
    const mx = endX - r.left;
    const x1 = Math.min(selAnchor, mx), x2 = Math.max(selAnchor, mx);
    selAnchor = null;
    selRect.setAttribute('opacity', '0');
    if (x2 - x1 < 6) { resetView(); return; }
    applyHL(x1, x2);
  }

  window.addEventListener('mouseup', e => { commitSel(e.clientX); });

  function resetView() {
    clearHL();
    selBar.style.display = 'none';
    document.querySelectorAll('.climb-item.active').forEach(e => e.classList.remove('active'));
  }

  selClear && selClear.addEventListener('click', resetView);
  svgEl.addEventListener('dblclick', resetView);
}

// ── Tab switching ────────────────────────────────────────────────
function switchTab(name) {
  clearHL();
  clearClimbLayers();
  clearRoadTypeLayers();
  gActiveRoadType = null;
  gSubidasActive = name === 'subidas';
  document.querySelectorAll('.climb-item.active').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.type-row.active-type').forEach(el => el.classList.remove('active-type'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'subidas') { showClimbsOnMap(); showClimbsOnProfile(); }
  if (name === 'tiempo') loadWeather();
}

const WMO = {
  0:['☀️','Despejado'], 1:['🌤️','Mayormente despejado'], 2:['⛅','Parcialmente nublado'],
  3:['☁️','Nublado'], 45:['🌫️','Niebla'], 48:['🌫️','Niebla con escarcha'],
  51:['🌦️','Llovizna ligera'], 53:['🌦️','Llovizna'], 55:['🌧️','Llovizna intensa'],
  61:['🌧️','Lluvia ligera'], 63:['🌧️','Lluvia'], 65:['🌧️','Lluvia intensa'],
  71:['❄️','Nieve ligera'], 73:['❄️','Nieve'], 75:['❄️','Nevada intensa'],
  80:['🌦️','Chubascos'], 81:['🌦️','Chubascos fuertes'], 82:['⛈️','Chubascos muy fuertes'],
  85:['❄️','Chubascos de nieve'], 86:['❄️','Chubascos de nieve fuertes'],
  95:['⛈️','Tormenta'], 96:['⛈️','Tormenta con granizo'], 99:['⛈️','Tormenta fuerte'],
};

let gWeatherLoaded = false;
async function loadWeather() {
  if (gWeatherLoaded || !gTrack) return;
  const panel = document.getElementById('weather-panel');
  if (!panel) return;
  const lat = gTrack.points?.[0]?.[0] ?? gTrack.center_lat;
  const lon = gTrack.points?.[0]?.[1] ?? gTrack.center_lon;
  if (!lat || !lon) { panel.textContent = 'Sin coordenadas de origen.'; return; }
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto&wind_speed_unit=kmh&forecast_days=5`;
    const r = await fetch(url);
    const d = await r.json();
    const c = d.current;
    const [emoji, desc] = WMO[c.weather_code] ?? ['🌡️', `Código ${c.weather_code}`];

    const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const forecastHTML = (d.daily?.time || []).map((dateStr, i) => {
      const dt   = new Date(dateStr + 'T12:00:00');
      const name = i === 0 ? 'Hoy' : DAYS[dt.getDay()];
      const [de] = WMO[d.daily.weather_code[i]] ?? ['🌡️',''];
      const mn   = Math.round(d.daily.temperature_2m_min[i]);
      const mx   = Math.round(d.daily.temperature_2m_max[i]);
      const pr   = d.daily.precipitation_sum[i];
      return `<div class="wx-day">
        <div class="wx-day-name">${name}</div>
        <div class="wx-day-icon">${de}</div>
        <div class="wx-day-range">${mx}° <span style="font-weight:400;color:var(--ink-3)">${mn}°</span></div>
        ${pr > 0 ? `<div class="wx-day-prec">💧${pr}mm</div>` : '<div class="wx-day-prec">&nbsp;</div>'}
      </div>`;
    }).join('');

    const windyUrl = `https://www.windy.com/?${lat.toFixed(4)},${lon.toFixed(4)},10`;
    gWeatherLoaded = true;
    panel.innerHTML = `
      <div id="weather-wrap">
        <div id="weather-main">
          <div class="wx-icon">${emoji}</div>
          <div>
            <div class="wx-temp">${Math.round(c.temperature_2m)}°C</div>
            <div class="wx-desc">${desc}</div>
          </div>
        </div>
        <div id="weather-details">
          <div class="wx-detail"><div class="wx-detail-val">${c.wind_speed_10m} km/h</div><div class="wx-detail-lbl">Viento</div></div>
          <div class="wx-detail"><div class="wx-detail-val">${c.relative_humidity_2m}%</div><div class="wx-detail-lbl">Humedad</div></div>
          <div class="wx-detail"><div class="wx-detail-val">${c.precipitation} mm</div><div class="wx-detail-lbl">Precipitación</div></div>
        </div>
        <div class="section-head" style="margin:16px 0 8px">Próximos 5 días</div>
        <div id="weather-forecast">${forecastHTML}</div>
        <div id="weather-location" style="margin-top:10px">
          📍 ${lat.toFixed(4)}, ${lon.toFixed(4)} · Fuente: Open-Meteo ·
          <a href="${windyUrl}" target="_blank" rel="noopener" style="color:#3b82f6;text-decoration:none">Ver detalle en Windy →</a>
        </div>
      </div>`;
  } catch(e) {
    panel.textContent = 'No se pudieron obtener datos meteorológicos.';
  }
}

  if (inp.value.trim()) return;
  document.getElementById('tag-input-row').hidden = true;
  document.getElementById('tag-open-btn').hidden = false;
}
async function saveTags(tags) {
  if (!gTrack) return;
  await fetch(`/api/tracks/${gTrack.id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tags: JSON.stringify(tags) }),
  });
}
function addTag() {
  const inp = document.getElementById('tag-input');
  const val = inp.value.trim().toLowerCase().replace(/\s+/g, '-');
  if (!val) return;
  const tags = getTags();
  if (tags.includes(val)) { inp.value = ''; return; }
  tags.push(val);
  renderTags(tags);
  saveTags(tags);
  inp.value = '';
  document.getElementById('tag-suggestions')?.classList.remove('open');
}
function removeTag(tag) {
  const tags = getTags().filter(t => t !== tag);
  renderTags(tags);
  saveTags(tags);
}
document.addEventListener('keydown', e => {
  if (document.activeElement?.id !== 'tag-input') return;
  if (e.key === 'Enter') addTag();
  if (e.key === 'Escape') { e.target.value = ''; closeTagInput(); }
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'tag-input') setTimeout(closeTagInput, 200);
});

// ── Climb click ──────────────────────────────────────────────────
function climbClick(el) {
  const wasActive = el.classList.contains('active');
  document.querySelectorAll('.climb-item.active').forEach(e => e.classList.remove('active'));
  if (wasActive) { clearHL(); return; }
  el.classList.add('active');
  const i1 = +el.dataset.i1, i2 = +el.dataset.i2;
  hlByIdx(i1, i2);
  if (gMap && gElePts && i2 < gElePts.length) {
    const lls = gElePts.slice(i1, i2 + 1).map(p => [p[0], p[1]]);
    gMap.fitBounds(L.latLngBounds(lls), { ...mapPadding(), maxZoom: 15 });
  }
  // Highlight segment in elevation profile
  const climbRect = document.getElementById('climb-rect');
  if (climbRect && gEleDists && gProfileParams) {
    const { l, t, CW, CH, totalDist } = gProfileParams;
    const d1 = gEleDists[Math.min(i1, gEleDists.length - 1)] ?? 0;
    const d2 = gEleDists[Math.min(i2, gEleDists.length - 1)] ?? totalDist;
    const x1 = l + (d1 / totalDist) * CW;
    const x2 = l + (d2 / totalDist) * CW;
    climbRect.setAttribute('x', x1.toFixed(1));
    climbRect.setAttribute('width', Math.max(2, x2 - x1).toFixed(1));
    climbRect.setAttribute('opacity', '1');
  }
}

// ── Comentarios ──────────────────────────────────────────────────
let gCommentsLoaded = false;
let gCurrentUser   = null;

function relTime(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 60)  return 'ahora mismo';
  if (diff < 3600) return `hace ${Math.floor(diff / 60)} min`;
  if (diff < 86400) return `hace ${Math.floor(diff / 3600)} h`;
  if (diff < 2592000) return `hace ${Math.floor(diff / 86400)} días`;
  return new Date(dateStr).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
}

function renderComments(list) {
  const el = document.getElementById('comments-list');
  const badge = document.getElementById('comments-badge');
  if (!el) return;
  if (badge) { badge.textContent = list.length; badge.hidden = list.length === 0; }
  if (!list.length) {
    el.innerHTML = '<div style="padding:10px 14px 12px;font-size:13px;color:var(--muted)">Aún no hay comentarios. ¡Sé el primero!</div>';
    return;
  }
  el.innerHTML = list.map(c => {
    const initials = (c.display_name || c.username || '?')[0].toUpperCase();
    const isOwnerOfTrack = gCurrentUser && gTrack && gCurrentUser.id === gTrack.owner_id;
    const canDel = gCurrentUser && (gCurrentUser.id === c.user_id || gCurrentUser.role === 'admin' || isOwnerOfTrack);
    const canReport = gCurrentUser && gCurrentUser.id !== c.user_id;
    const editedTag = c.edited_at ? `<span class="comment-edited" title="Editado el ${new Date(c.edited_at).toLocaleString('es-ES')}">editado</span>` : '';
    return `<div class="comment-item" data-id="${c.id}">
      <div class="comment-avatar">${esc(initials)}</div>
      <div class="comment-content">
        <div class="comment-meta">
          <span class="comment-user">${esc(c.display_name || c.username)}</span>
          <span class="comment-date">${relTime(c.created_at)}</span>
          ${editedTag}
        </div>
        <div class="comment-body">${esc(c.body)}</div>
      </div>
      <div class="comment-actions">
        ${canReport ? `<button class="comment-report-btn" onclick="openReportModal('comment',${c.id})" title="Denunciar">⚑</button>` : ''}
        ${canDel ? `<button class="comment-del" onclick="deleteComment(${c.id})" title="Eliminar">×</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function loadComments() {
  if (gCommentsLoaded || !trackId) return;
  gCommentsLoaded = true;
  try {
    const [comments, me] = await Promise.all([
      fetch(`/api/tracks/${trackId}/comments`).then(r => r.ok ? r.json() : []),
      fetch('/api/auth/me').then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    gCurrentUser = me;
    renderComments(comments);
    if (me) {
      document.getElementById('comment-form').hidden = false;
      const isOwner = gTrack && me.id === gTrack.owner_id;
      const doneBtn = document.getElementById('done-btn');
      if (doneBtn) doneBtn.hidden = false;
      const starsWidget = document.getElementById('stars-widget');
      if (starsWidget) starsWidget.style.pointerEvents = isOwner ? 'none' : '';
      if (starsWidget) starsWidget.style.opacity = isOwner ? '0.4' : '';
      loadRatingAndDone();
    } else {
      const starsWidget = document.getElementById('stars-widget');
      if (starsWidget) starsWidget.style.pointerEvents = 'none';
      if (!window.GPX_ANON) {
        document.getElementById('comment-login-hint').hidden = false;
      } else {
        document.getElementById('comment-login-hint').hidden = false;
      }
    }
  } catch {
    const el = document.getElementById('comments-list');
    if (el) el.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:var(--muted)">No se pudieron cargar comentarios.</div>';
  }
}

async function postComment() {
  const inp = document.getElementById('comment-input');
  const text = inp.value.trim();
  if (!text) return;
  const btn = inp.nextElementSibling?.querySelector('button');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(`/api/tracks/${trackId}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: text }),
    });
    if (!r.ok) throw new Error((await r.json()).error || 'Error');
    const comment = await r.json();
    inp.value = '';
    // Refresh comments
    gCommentsLoaded = false;
    const [comments] = await Promise.all([
      fetch(`/api/tracks/${trackId}/comments`).then(r2 => r2.ok ? r2.json() : []),
    ]);
    renderComments(comments);
  } catch (e) { alert(e.message); }
  finally { if (btn) btn.disabled = false; }
}

async function deleteComment(cid) {
  if (!confirm('¿Eliminar este comentario?')) return;
  try {
    await fetch(`/api/tracks/${trackId}/comments/${cid}`, { method: 'DELETE' });
    const el = document.querySelector(`.comment-item[data-id="${cid}"]`);
    if (el) el.remove();
    const list = document.querySelectorAll('.comment-item');
    const badge = document.getElementById('comments-badge');
    if (badge) { badge.textContent = list.length; badge.hidden = list.length === 0; }
    if (!list.length) {
      document.getElementById('comments-list').innerHTML = '<div style="padding:10px 14px 12px;font-size:13px;color:var(--muted)">Aún no hay comentarios. ¡Sé el primero!</div>';
    }
  } catch { alert('No se pudo eliminar'); }
}

function updateCommentCounter() {
  const inp = document.getElementById('comment-input');
  const ctr = document.getElementById('comment-counter');
  if (inp && ctr) ctr.textContent = `${inp.value.length} / 2000`;
}

// ── Valoraciones y «la he hecho» ─────────────────────────────────
let gMyRating = null;
let gMyDone   = null;

async function loadRatingAndDone() {
  if (!trackId || !gCurrentUser) return;
  try {
    const [rr, dr] = await Promise.all([
      fetch(`/api/tracks/${trackId}/rating`).then(r => r.ok ? r.json() : null),
      fetch(`/api/tracks/${trackId}/done`).then(r => r.ok ? r.json() : null),
    ]);
    if (rr) {
      gMyRating = rr.mine;
      renderStars(rr.mine, rr.avg, rr.count);
    }
    if (dr) {
      gMyDone = dr.done_on;
      renderDoneBtn(dr.done_on, dr.count);
    }
  } catch {}
}

function renderStars(mine, avg, count) {
  const btns = document.querySelectorAll('.star-btn');
  btns.forEach(b => {
    const v = +b.dataset.v;
    b.classList.toggle('filled', v <= (mine || 0));
  });
  const lbl = document.getElementById('rating-avg-label');
  if (lbl) {
    if (count > 0) lbl.textContent = `${(avg||0).toFixed(1)} (${count} ${count === 1 ? 'valoración' : 'valoraciones'})`;
    else lbl.textContent = 'Sin valoraciones aún';
  }
}

let gDoneCount = 0;

function renderDoneBtn(doneOn, count) {
  const btn = document.getElementById('done-btn');
  const lbl = document.getElementById('done-date-label');
  if (!btn) return;
  if (count !== undefined) gDoneCount = count;
  const countStr = gDoneCount > 0 ? ` (${gDoneCount})` : '';
  if (doneOn) {
    btn.textContent = '✓ La he hecho' + countStr;
    btn.classList.add('active');
    if (lbl) lbl.textContent = 'desde ' + new Date(doneOn).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
  } else {
    btn.textContent = 'La he hecho' + countStr;
    btn.classList.remove('active');
    if (lbl) lbl.textContent = '';
  }
  btn.hidden = false;
}

async function setRating(stars) {
  if (!gCurrentUser) return;
  if (gTrack && gCurrentUser.id === gTrack.owner_id) return;
  try {
    const r = await fetch(`/api/tracks/${trackId}/rating`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stars }),
    });
    if (!r.ok) { const e = await r.json(); alert(e.error || 'Error'); return; }
    const data = await r.json();
    gMyRating = stars;
    renderStars(stars, data.avg, data.count);
  } catch { alert('Error al valorar'); }
}

async function toggleDone() {
  if (!gCurrentUser) return;
  try {
    if (gMyDone) {
      await fetch(`/api/tracks/${trackId}/done`, { method: 'DELETE' });
      gMyDone = null;
      renderDoneBtn(null, gDoneCount - 1);
    } else {
      const today = new Date().toISOString().slice(0,10);
      const r = await fetch(`/api/tracks/${trackId}/done`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done_on: today }),
      });
      if (!r.ok) { alert('Error'); return; }
      gMyDone = today;
      renderDoneBtn(today, gDoneCount + 1);
    }
  } catch { alert('Error'); }
}

// ── Enrich road types via OSM ────────────────────────────────────
async function enrichRoadTypes() {
  if (!gTrack) return;
  const btn = document.getElementById('enrich-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Consultando OSM…'; }
  const es = new EventSource(`/api/db/enrich-road-types?ids=${gTrack.id}`);
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'done') {
      es.close();
      // Reload track data to refresh road types display
      fetch(`/api/tracks/${gTrack.id}`)
        .then(r => r.json())
        .then(t => {
          gTrack = t;
          updateMapBar(t);
          const sec = document.getElementById('road-section');
          if (!sec) return;
          const hwHTML = buildTypeSection(t.road_types, HW_META);
          const sfHTML = buildTypeSection(t.surface_types, SF_META);
          const hasMap = (hwHTML || sfHTML) && t.road_type_seq;
          sec.innerHTML = `
            ${hasMap ? `<div class="climb-map-bar"><button class="btn btn-outline btn-sm" id="road-map-btn" onclick="toggleRoadTypesOnMap()">Mostrar en mapa</button></div>` : ''}
            ${hwHTML ? `<div class="section-head">Tipos de camino</div>${hwHTML}` : '<p style="font-size:13px;color:var(--ink-3);margin:0 0 4px">Sin cobertura OSM en esta zona.</p>'}
            ${sfHTML ? `<div class="section-head" style="margin-top:20px">Superficie</div>${sfHTML}` : ''}
            <button class="enrich-btn" onclick="enrichRoadTypes()" id="enrich-btn" style="margin-top:12px">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
              Actualizar datos OSM
            </button>`;
          if (t.road_type_seq && gRoadTypeMapVisible) showRoadTypesOnMap(t);
        });
    }
  };
  es.onerror = () => {
    es.close();
    if (btn) { btn.disabled = false; btn.textContent = 'Reintentar'; }
  };
}


// ── Denuncia ──────────────────────────────────────────────────────
let gReportKind = null, gReportTargetId = null;
function openReportModal(kind, targetId) {
  gReportKind = kind; gReportTargetId = targetId;
  const m = document.getElementById('report-modal');
  m.querySelector('textarea').value = '';
  m.querySelector('#report-error').textContent = '';
  document.getElementById('report-submit-btn').disabled = false;
  m.querySelector('#report-title').textContent = kind === 'comment' ? 'Denunciar comentario' : 'Denunciar ruta';
  m.classList.add('open');   // .modal-overlay is display:none until .open (shared.css)
  setTimeout(() => m.querySelector('textarea').focus(), 30);
}
function closeReportModal() { document.getElementById('report-modal').classList.remove('open'); }
async function submitReport() {
  const reason = document.getElementById('report-modal').querySelector('textarea').value.trim();
  const errEl = document.getElementById('report-error');
  if (!reason) { errEl.textContent = 'Escribe el motivo.'; return; }
  const btn = document.getElementById('report-submit-btn');
  btn.disabled = true;
  try {
    const r = await fetch('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: gReportKind, target_id: gReportTargetId, reason }) });
    if (!r.ok) throw new Error('Error al enviar la denuncia');
    closeReportModal();
    showToast('Denuncia enviada. La revisaremos en breve.');
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false;
  }
}
</script>

<!-- Modal de denuncia -->
<div id="report-modal" class="modal-overlay" onclick="if(event.target===this)closeReportModal()">
  <div class="modal" style="max-width:460px">
    <div class="modal-head">
      <h3 id="report-title">Denunciar contenido</h3>
      <button class="icon-btn" onclick="closeReportModal()" title="Cerrar" aria-label="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" style="display:grid;gap:10px">
      <p style="margin:0;font-size:13px;color:var(--ink-2)">Cuéntanos por qué crees que incumple las normas de la comunidad. Un administrador lo revisará.</p>
      <textarea class="textarea" rows="4" maxlength="500" placeholder="Motivo de la denuncia…"></textarea>
      <span id="report-error" style="color:var(--danger);font-size:12px"></span>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeReportModal()">Cancelar</button>
      <button class="btn btn-primary" id="report-submit-btn" onclick="submitReport()">Enviar denuncia</button>
    </div>
  </div>
</div>
