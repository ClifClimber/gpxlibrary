<!DOCTYPE html>
<!--
  Plantilla para páginas nuevas de GPX Library.
  1. Copia este archivo a la raíz con el nombre de la página (p. ej. stats.html)
     y añade la ruta en server.js si hace falta.
  2. Añade el enlace en la <nav> de TODAS las páginas.
  3. Usa solo los tokens y componentes de shared.css; el <style> de la página
     contiene únicamente su maquetación propia.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Título — GPX Library</title>
  <link rel="stylesheet" href="/shared.css">
  <script src="/theme.js"></script>
  <style>
    /* Maquetación propia de la página (usar var(--ink), var(--soft), var(--radius)...) */
  </style>
</head>
<body>

<nav>
  <span class="logo">GPX Library</span>
  <a href="/">Visor</a>
  <a href="/editor">Catálogo</a>
  <a href="/compare">Comparar</a>
  <a href="/admin">Admin</a>
</nav>

<main class="page">
  <!-- Cabecera: icono en tile de acento + título + acciones -->
  <div class="page-hero">
    <span class="page-hero-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg></span>
    <div>
      <h1>Título de la página</h1>
      <div class="page-sub">Descripción breve</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-outline">Secundaria</button>
      <button class="btn btn-primary">Acción principal</button>
    </div>
  </div>

  <!-- Tarjeta con cabecera de icono -->
  <section class="card">
    <div class="card-body">
      <div class="ico-head">
        <span class="ico-head-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
        <div><h2>Sección</h2><p>Qué contiene esta sección</p></div>
        <div class="ico-head-extra"><button class="btn btn-sm">Acción</button></div>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="val">123</div><div class="lbl">Tracks</div></div>
        <div class="stat"><div class="val">4.567</div><div class="lbl">km</div></div>
      </div>
      <label style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" class="switch" checked> Interruptor</label>
    </div>
  </section>
  <!-- Otros componentes en shared.css: .hero (portada + avatar + cifras), .pill-tabs/.pill-tab, .cover-bg,
       .empty-state, .bar-chart, body.auth (pantallas de acceso) -->

</main>

<div id="toast"></div>
</body>
</html>
